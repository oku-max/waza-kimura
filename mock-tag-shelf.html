<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOCK — タグ設定（1画面）</title>
<!--
  見本の画面。本物のデータには一切書き込まない（localStorage も Firestore も触らない）。
  この端末に保存されているタグ設定（wk_tagSettings）を「読むだけ」して、グループ名と選択肢を本物に近づける。
  触った結果はこのページの中だけで、閉じれば消える。
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1c1c1e;--card:#2c2c2e;--field:#38383a;--bd:#48484a;--line:#3a3a3c;--text:#e5e5e7;--sub:#9a9aa0;--dim:#6e6e73;--gold:#e5c47a;--red:#ff8080}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'DM Sans','Hiragino Sans','Noto Sans JP',-apple-system,sans-serif;max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:40px}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
.banner{background:#3a2f12;color:#f3dc9f;font-size:12px;line-height:1.6;padding:10px 16px}
.tabs{display:flex;gap:6px;padding:12px 16px 4px;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{flex:1;padding:9px 6px;border-radius:9px;border:1px solid var(--bd);background:none;font-size:12px;color:var(--sub)}
.tab.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.wrap{padding:12px 16px}
.h{font-size:20px;font-weight:700;margin:6px 0 2px}
.cap{font-size:12px;color:var(--sub);margin:18px 2px 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 14px}
.row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.num{font-size:11px;font-weight:700;color:#1a1a1a;background:var(--gold);border-radius:6px;padding:3px 7px;flex-shrink:0}
.num.off{background:var(--dim)}
.rbtn{flex:1;min-width:0;background:none;border:none;text-align:left;padding:14px 0}
.rn{font-size:16px;font-weight:600}
.rs{font-size:12px;color:var(--sub);margin-top:2px}
.chev{background:none;border:none;color:var(--sub);font-size:18px;padding:14px 4px}
.swb{background:none;border:none;padding:10px 0;flex-shrink:0}
.pill.ghostpill{border-color:var(--bd);color:var(--text);font-weight:400}
.btns{display:flex;gap:6px;flex-shrink:0}
.curpick{border-color:var(--gold)}
.pill{padding:8px 13px;border-radius:9px;border:1px solid var(--gold);background:none;color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0}
.big{width:100%;display:flex;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:15px 14px;text-align:left;font-size:14px;margin-top:18px}
.big span:first-child{flex:1}
.note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:48px 12px 20px;overflow-y:auto}
.sheet{width:100%;max-width:560px;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.sh-h{display:flex;align-items:center;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
.sh-t{flex:1;font-size:16px;font-weight:700}
.x{background:none;border:none;color:var(--sub);font-size:20px;padding:4px 8px}
.sh-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12px;color:var(--sub);margin-bottom:6px;display:block}
.inp{width:100%;background:var(--field);border:1.5px solid var(--bd);border-radius:9px;padding:12px 10px;font-size:15px}
.acc{width:100%;display:flex;align-items:center;gap:8px;background:var(--field);border:1.5px solid var(--bd);border-radius:9px;padding:13px 12px;text-align:left;font-size:14px}
.acc.on{border-color:var(--gold)}
.acc .grow{flex:1}
.acc .c{font-size:13px;color:var(--sub)}
.acc .car{font-size:12px;color:var(--gold)}
.box{margin-top:8px;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.list{max-height:240px;overflow-y:auto}
.li{display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border-bottom:1px solid var(--line)}
.li span{flex:1;font-size:14px;padding:12px 0}
.li button{background:none;border:none;color:var(--sub);font-size:16px;padding:12px 10px}
.addrow{display:flex;gap:7px;padding:10px;background:var(--field);border-top:1px solid var(--bd)}
.addrow input{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--bd);border-radius:9px;padding:10px;font-size:14px}
.gold{padding:10px 16px;border-radius:9px;border:none;background:var(--gold);color:#1a1a1a;font-size:13px;font-weight:700}
.tp{border-bottom:1px solid var(--line)}
.tp-h{width:100%;display:flex;align-items:center;background:none;border:none;text-align:left;padding:12px}
.tp-h .grow{flex:1}
.tp-h .n{display:block;font-size:14px}
.tp-h .s{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px}
.chip{padding:7px 12px;border-radius:16px;border:1px solid #5a5a5c;background:none;font-size:13px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1a1a}
.chip.has{border-color:var(--line);color:var(--dim);cursor:default}
.apply{margin:12px;width:calc(100% - 24px);padding:11px;border-radius:9px;border:none;font-size:13px;font-weight:700;background:var(--line);color:var(--dim)}
.apply.ok{background:var(--gold);color:#1a1a1a}
.sw{width:48px;height:28px;border-radius:14px;background:var(--bd);display:flex;align-items:center;justify-content:flex-start;flex-shrink:0}
.sw.on{background:var(--gold);justify-content:flex-end}
.sw i{width:22px;height:22px;border-radius:11px;background:#fff;margin:0 3px;display:block}
.sep{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ghost{padding:12px;border-radius:9px;border:1px solid var(--bd);background:none;font-size:14px;text-align:left}
.ghost small{color:var(--sub);font-size:12px}
.danger{padding:12px;border-radius:9px;border:1px solid var(--red);background:none;color:var(--red);font-size:14px;text-align:left}
.confirm{border:1px solid var(--red);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{font-size:13px;color:#ffb3b3;line-height:1.6}
.two{display:flex;gap:8px}
.two button{flex:1;padding:11px;border-radius:9px;font-size:14px}
.btn-plain{border:1px solid var(--bd);background:none}
.btn-red{border:none;background:var(--red);color:#1a1a1a;font-weight:700}
.btn-gold{border:none;background:var(--gold);color:#1a1a1a;font-weight:700}
.pick{width:100%;display:flex;align-items:center;gap:8px;background:var(--field);border:1.5px solid var(--bd);border-radius:9px;padding:13px 12px;text-align:left;font-size:14px}
.pick .grow{flex:1}.pick small{color:var(--sub);font-size:12px}
.p{font-size:13px;color:var(--sub);line-height:1.7}
.vid{height:190px;background:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.vr{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.vr .l{font-size:12px;color:var(--sub);width:96px;flex-shrink:0;padding-top:6px}
.vr .cs{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.vc{padding:5px 11px;border-radius:14px;background:var(--field);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;width:calc(100% - 32px);max-width:560px;background:var(--field);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:30}
.toast span{flex:1;font-size:14px}
.toast button{background:none;border:none;color:var(--gold);font-weight:700;font-size:14px;padding:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ct{display:flex;align-items:center;gap:8px;padding:13px 10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--field);font-size:14px;text-align:left}
.ct.on{border-color:var(--gold);background:rgba(229,196,122,.12)}
.ct .ic{width:22px;text-align:center;color:var(--sub)}
.ct .grow{flex:1}
.new{font-size:10px;color:#1a1a1a;background:var(--gold);border-radius:4px;padding:1px 5px}

.badge{font-size:11px;font-weight:700;color:#1a1a1a;background:var(--gold);border-radius:10px;padding:2px 8px;margin-left:6px}
.big small{font-weight:400}
.warn{font-size:12px;color:#f3dc9f;background:#3a2f12;padding:9px 12px;line-height:1.6}
.secbox{display:flex;flex-direction:column}
.secin{border:1px solid var(--bd);border-top:none;border-radius:0 0 9px 9px;padding:12px;margin-top:-4px;display:flex;flex-direction:column;gap:4px}
.sel{width:100%;background:var(--field);border:1.5px solid var(--bd);border-radius:9px;padding:11px 10px;font-size:14px;color:var(--text)}
.dup{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.pill.redpill{border-color:var(--red);color:var(--red)}

.grow-row{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;border-bottom:1px solid var(--line);padding:14px 0;text-align:left}
.gname{font-size:16px;font-weight:600}
.gsub{font-size:12px;color:var(--sub);flex:1}
.panel{padding:12px 0 16px;border-bottom:1px solid var(--line)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.optwrap{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:2px;background:var(--field);border-radius:14px;padding:4px 4px 4px 11px;font-size:13px}
.opt button{background:none;border:none;color:var(--sub);font-size:14px;padding:2px 6px}
.issue{border:1px solid rgba(229,196,122,.4);border-radius:9px;padding:4px 10px}
.irow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.irow:last-child{border-bottom:none}
.irow span{flex:1;min-width:140px}.irow small{color:var(--sub);font-size:12px}
.mini{padding:7px 11px;border-radius:8px;border:1px solid var(--bd);background:none;font-size:12px}
.mini.red{border-color:var(--red);color:var(--red)}
.ops{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.capbtn{background:none;border:none;display:flex;width:100%;justify-content:space-between;padding:0 2px;font-family:inherit;cursor:pointer}
.foot{margin-top:18px}
.linkbtn{background:none;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:14px;width:100%;text-align:left}
</style>
</head>
<body>
<div class="banner">見本の画面です。ここで操作しても、本物のタグや動画は変わりません（閉じると元に戻ります）。グループ名と選択肢は、この端末に保存されている設定を読み込んで表示しています。</div>
<div class="tabs">
  <button class="tab" data-tab="set">タグ設定</button>
  <button class="tab" data-tab="vid">動画のタグをクリア</button>
  <button class="tab" data-tab="col">列を追加</button>
</div>
<div id="app"></div>

<script>
(function(){
'use strict';
// ── この端末のタグ設定を「読むだけ」。書き込みはしない ──
function readSettings(){
  try { var p = JSON.parse(localStorage.getItem('wk_tagSettings') || 'null'); return Array.isArray(p) ? p : null; }
  catch(e){ return null; }
}
var real = readSettings();
var FALL = {
  tb:{name:'TOP/BOTTOM', opts:['トップ','ボトム','スタンディング']},
  cat:{name:'Category', opts:['エスケープ・ディフェンス','コンセプト・原理','パスガード','スイープ','フィニッシュ']},
  pos:{name:'Position', opts:['クローズドガード','デラヒーバ','ハーフガード','スパイダー','ラッソー']},
  tags:{name:'テクニック', opts:['アームバー','キムラ','三角絞め','ベリンボロ']}
};
function fromReal(key){
  var t = real && real.find(function(x){ return x && x.key === key; });
  if (!t) return { name: FALL[key].name, opts: FALL[key].opts.slice() };
  return { name: (t.label && String(t.label).trim()) || FALL[key].name, opts: Array.isArray(t.presets) ? t.presets.slice() : [] };
}
function grp(key, extra){ var g = fromReal(key); return Object.assign({ name:g.name, opts:g.opts, search:true }, extra||{}); }

// 初期のタググループ（まっさらから始めた人が持っているもの）。「初期設定に戻す」の基準
var DEF = {
  tb:   { name:'トップ/ボトム', vals:['トップ','ボトム','スタンディング'], search:true },
  pos:  { name:'ポジション', vals:['クローズドガード','デラヒーバ','ハーフガード','スパイダー','ラッソー','バタフライ','Xガード','マウント','サイド','バック'], search:true },
  mark: { name:'マーク', vals:['⭐ お気に入り','🎯 Next','🟣 ドリル'], search:false },
  prog: { name:'習得', vals:['未着手','理解','練習中','マスター'], search:false }
};
// この端末に保存されている旧テンプレート（編集したことがある人だけ）を「読むだけ」
function readOldTemplates(){
  try { var p = JSON.parse(localStorage.getItem('wk_tagTemplates') || 'null'); return (p && Array.isArray(p.list)) ? p.list : []; }
  catch(e){ return []; }
}
var S = {
  tab: 'set',
  // タグ1〜4 は常に4つ。中身はタググループか、未設定（null）
  boxes: ['tb','cat','pos','tags'],
  groups: {
    tb: grp('tb',{def:'tb'}), cat: grp('cat'), pos: grp('pos',{def:'pos'}), tags: grp('tags'),
    mark: { name:'マーク', opts:DEF.mark.vals.slice(), search:false, def:'mark' },
    prog: { name:'習得', opts:DEF.prog.vals.slice(), search:false, def:'prog' }
  },
  open:null, sheet:null, ed:false, edSec:null, optsOpen:false, confirmDel:false, draft:'', addNote:'', seq:1, toast:null,
  mFrom:'', mTo:'', cFrom:'', cTo:'', cPicks:[],
  vid:{ cleared:false, asking:false },
  col:'count'
};
Object.keys(S.groups).forEach(function(id){ S.groups[id].ghosts = []; });
// 見本: 選択肢に無いタグ・2つのタググループにある同じ名前
S.groups.cat.ghosts = [['ドリル',4]];
S.groups.pos.ghosts = [['コンバットベース',19],['幽霊ポジション',1]];
if (S.groups.tags.opts.indexOf('十字絞め') < 0) S.groups.tags.opts.push('十字絞め');
if (S.groups.pos.opts.indexOf('十字絞め') < 0) S.groups.pos.opts.push('十字絞め');
readOldTemplates().forEach(function(t, i){
  if (!t || !Array.isArray(t.values)) return;
  S.groups['tpl' + i] = { name:String(t.name||'テンプレート') + '（旧テンプレート）', opts:t.values.slice(), search:true, ghosts:[] };
});
// 本数は見本の数字（名前から決まる固定の数）
function cnt(gid, v){ var h = 0; String(gid + v).split('').forEach(function(c){ h = (h * 31 + c.charCodeAt(0)) % 997; }); return h % 28 + 1; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function snap(){ return { groups:clone(S.groups), boxes:S.boxes.slice() }; }
function toast(text, sn){ S.toast = { text:text, snap:sn }; }

var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
var app = document.getElementById('app');
var H = {}; var hid = 0;
function on(fn){ var k = 'h' + (hid++); H[k] = fn; return 'data-h="' + k + '"'; }
function unusedIds(){ return Object.keys(S.groups).filter(function(id){ return S.boxes.indexOf(id) < 0; }); }
function allIds(){ return S.boxes.filter(Boolean).concat(unusedIds()); }
function label(id){ var k = S.boxes.indexOf(id); return (k >= 0 ? 'タグ' + (k+1) + ' ' : '') + S.groups[id].name; }
function set(p){ Object.assign(S, p); render(); }
function sw(onv){ return '<span class="sw' + (onv?' on':'') + '"><i></i></span>'; }
function subOf(g){ return g.opts.length + '個' + (g.search ? '' : '・検索の対象外'); }
function openGroup(id){ set({ exp:id, unOpen: S.boxes.indexOf(id) < 0 ? true : S.unOpen, sheet:null, confirmDel:false, draft:'', addNote:'' }); }
function dupes(){
  var m = {};
  allIds().forEach(function(id){ S.groups[id].opts.forEach(function(v){ (m[v] = m[v] || []).push(id); }); });
  return Object.keys(m).filter(function(v){ return m[v].length > 1; }).map(function(v){ return { v:v, ids:m[v] }; });
}
function ghostCount(){ return allIds().reduce(function(n, id){ return n + S.groups[id].ghosts.length; }, 0); }
function missingDefaults(key){ var g = S.groups[key]; return g ? DEF[key].vals.filter(function(v){ return g.opts.indexOf(v) < 0; }) : DEF[key].vals.slice(); }
function edIssues(){ return dupes().length + ghostCount(); }

function issuesOf(id){
  var g = S.groups[id];
  var du = dupes().filter(function(d){ return d.ids.indexOf(id) >= 0; });
  return { ghosts:g.ghosts, dupes:du, n:g.ghosts.length + du.length };
}
function toggleExp(key){ set({ exp: S.exp === key ? null : key, draft:'', addNote:'', confirmDel:false }); }

// ── 1画面: タグ1〜4 と未使用のタググループを同じ形の行で並べ、押すとその場で開く ──
function viewSettings(){
  var h = '<div class="wrap"><div class="h">タグ設定</div>';
  h += '<div class="cap">使用中のタグ</div><div class="card">';
  S.boxes.forEach(function(id, k){
    var key = id || ('slot' + k), open = S.exp === key;
    if (!id) {
      h += '<button class="grow-row" ' + on(function(){ toggleExp(key); }) + '><span class="num off">タグ' + (k+1) + '</span><span class="gname" style="color:var(--sub);font-weight:400;flex:1">未設定</span><span class="car">' + (open?'▲':'▼') + '</span></button>';
      if (open) h += '<div class="panel">' + slotPicker(k) + '</div>';
      return;
    }
    h += groupRow(id, k, open);
  });
  h += '</div>';
  var un = unusedIds();
  h += '<button class="cap capbtn" ' + on(function(){ set({ unOpen: !S.unOpen }); }) + '><span>未使用のタググループ（' + un.length + '）</span><span class="car">' + (S.unOpen?'▲':'▼') + '</span></button>';
  if (S.unOpen) {
    h += '<div class="card">';
    if (!un.length) h += '<div class="rs" style="padding:14px 0">ありません</div>';
    un.forEach(function(id){ h += groupRow(id, -1, S.exp === id); });
    h += '</div><div class="note" style="margin-top:6px">付けたタグは動画に残っています。使うときは、開いて「使う場所」を選びます。</div>';
  }
  h += '<div class="foot"><button class="linkbtn" ' + on(function(){ set({ sheet:{ kind:'reset' } }); }) + '>初期設定に戻す</button></div>';
  h += '<div class="note">「テンプレートから追加」「まとめて整理する」「フィルター設定」は無くなります。今のテンプレートは未使用のタググループに残ります。本数は見本の数字です。</div></div>';
  return h + viewSheet() + viewToast();
}

function groupRow(id, k, open){
  var g = S.groups[id], iss = issuesOf(id);
  var h = '<button class="grow-row" ' + on(function(){ toggleExp(id); }) + '>' + (k >= 0 ? '<span class="num">タグ' + (k+1) + '</span>' : '<span class="num off">未使用</span>') + '<span class="gname">' + esc(g.name) + '</span><span class="gsub">' + g.opts.length + '個' + (g.search ? '' : '・検索の対象外') + '</span>' + (iss.n ? '<span class="badge">要確認 ' + iss.n + '</span>' : '') + '<span class="car">' + (open?'▲':'▼') + '</span></button>';
  if (open) h += '<div class="panel">' + groupPanel(id, k) + '</div>';
  return h;
}

// 未設定のタグ: 使うタググループを選ぶ
function slotPicker(k){
  var h = '<div class="p">タグ' + (k+1) + 'に使うタググループを選んでください。</div><div class="chips" style="padding:8px 0 0">';
  unusedIds().forEach(function(id){ h += '<button class="chip" ' + on(function(){ var b = S.boxes.slice(); b[k] = id; set({ boxes:b, exp:id }); }) + '>' + esc(S.groups[id].name) + '</button>'; });
  h += '<button class="chip" style="border-color:var(--gold);color:var(--gold)" ' + on(function(){ var nid = 'new' + (S.seq++); S.groups[nid] = { name:'新しいタググループ', opts:[], search:true, ghosts:[] }; var b = S.boxes.slice(); b[k] = nid; set({ boxes:b, exp:nid }); }) + '>＋ 新しく作る</button></div>';
  return h;
}

// 開いたタググループの中身。ここですべて済む
function groupPanel(id, k){
  var g = S.groups[id], iss = issuesOf(id);
  var h = '';
  // 名前と使う場所
  h += '<div class="two2"><div><label class="lbl" for="gname">タググループ名</label><input id="gname" class="inp" value="' + esc(g.name) + '" data-rename="' + id + '"></div>';
  h += '<div><label class="lbl" for="gslot">使う場所</label><select id="gslot" class="sel" data-slotof="' + id + '">';
  h += '<option value="-1"' + (k < 0 ? ' selected' : '') + '>未使用</option>';
  S.boxes.forEach(function(x, j){ h += '<option value="' + j + '"' + (j === k ? ' selected' : '') + '>タグ' + (j+1) + (x && x !== id ? '（' + esc(S.groups[x].name) + 'と入れ替え）' : '') + '</option>'; });
  h += '</select></div></div>';
  // 選択肢（チップで一覧）
  h += '<div class="lbl" style="margin-top:12px">選択肢 ' + g.opts.length + '個<span style="float:right;color:var(--dim)">×で外す</span></div><div class="optwrap">';
  g.opts.forEach(function(o){ h += '<span class="opt">' + esc(o) + '<button aria-label="' + esc(o) + 'を外す" ' + on(function(){ set({ sheet:{ kind:'rmopt', id:id, v:o, n:cnt(id, o) } }); }) + '>×</button></span>'; });
  if (!g.opts.length) h += '<span style="color:var(--sub);font-size:13px">まだありません</span>';
  h += '</div><div class="addrow" style="border:1px solid var(--bd);border-radius:9px;margin-top:8px"><input id="draft" placeholder="選択肢を追加..." aria-label="選択肢を追加" value="' + esc(S.draft) + '"><button class="gold" ' + on(function(){
    var v = (document.getElementById('draft').value||'').trim(); if (!v || g.opts.indexOf(v) >= 0) return;
    var other = allIds().filter(function(x){ return x !== id && S.groups[x].opts.indexOf(v) >= 0; });
    g.opts.push(v); S.draft = '';
    S.addNote = other.length ? '「' + v + '」は ' + other.map(label).join('・') + ' にもあります。別のタグとして追加しました。' : '';
    render();
  }) + '>追加</button></div>';
  if (S.addNote) h += '<div class="warn" style="border-radius:8px;margin-top:6px">' + esc(S.addNote) + '</div>';
  // 要確認（このタググループに関係するものだけ）
  if (iss.n) {
    h += '<div class="lbl" style="margin-top:12px;color:var(--gold)">要確認</div><div class="issue">';
    iss.ghosts.forEach(function(gh){
      h += '<div class="irow"><span><b>' + esc(gh[0]) + '</b> <small>選択肢に無いタグ・' + gh[1] + '本</small></span><button class="mini" ' + on(function(){ var sn = snap(); g.opts.push(gh[0]); g.ghosts = g.ghosts.filter(function(x){ return x !== gh; }); toast('「' + gh[0] + '」を選択肢に入れました', sn); render(); }) + '>選択肢に入れる</button><button class="mini red" ' + on(function(){ var sn = snap(); g.ghosts = g.ghosts.filter(function(x){ return x !== gh; }); toast('「' + gh[0] + '」を' + gh[1] + '本の動画から外しました', sn); render(); }) + '>動画から外す</button></div>';
    });
    iss.dupes.forEach(function(d){
      var others = d.ids.filter(function(x){ return x !== id; });
      h += '<div class="irow"><span><b>' + esc(d.v) + '</b> <small>' + others.map(function(x){ return esc(S.groups[x].name); }).join('・') + ' にもある</small></span><button class="mini" ' + on(function(){ set({ sheet:{ kind:'dupe', v:d.v, keep:id, ids:d.ids } }); }) + '>ここに寄せる</button></div>';
    });
    h += '</div>';
  }
  // 検索の対象
  h += '<button class="acc" style="margin-top:12px" ' + on(function(){ g.search = !g.search; render(); }) + '><span class="grow"><span style="display:block">検索の対象にする</span><span style="display:block;font-size:12px;color:var(--sub);margin-top:2px">' + (g.search ? 'このタググループのタグも、ワード検索の対象になります' : 'ワード検索の対象外です（絞り込みには使えます）') + '</span></span>' + sw(g.search) + '</button>';
  // そのほかの操作（1列にまとめる）
  h += '<div class="ops"><button class="mini" ' + on(function(){ set({ sheet:{ kind:'copy', to:id, from:'' }, cPicks:[] }); }) + '>ほかから選択肢をコピー</button><button class="mini" ' + on(function(){ set({ sheet:{ kind:'merge', from:id, to:'' } }); }) + '>ほかにマージ</button>';
  if (g.def) h += '<button class="mini" ' + on(function(){ set({ sheet:{ kind:'defone', key:g.def } }); }) + '>初期値に戻す</button>';
  h += '<button class="mini red" ' + on(function(){ set({ confirmDel:true }); }) + '>削除</button></div>';
  if (S.confirmDel) h += '<div class="confirm" style="margin-top:8px"><p>「' + esc(g.name) + '」を削除します。このタググループのタグは、付いているすべての動画から外れます。' + (k >= 0 ? 'タグ' + (k+1) + 'は未設定になります。' : '') + '先にバックアップを保存します。タグを残したいときは、削除せずに「使う場所」を未使用にしてください。</p><div class="two"><button class="btn-plain" ' + on(function(){ set({ confirmDel:false }); }) + '>キャンセル</button><button class="btn-red" ' + on(function(){ var sn = snap(); var nm = g.name; delete S.groups[id]; S.boxes = S.boxes.map(function(x){ return x === id ? null : x; }); toast('「' + nm + '」を削除しました', sn); set({ exp:null, confirmDel:false }); }) + '>削除する</button></div></div>';
  return h;
}

function viewSheet(){
  if (!S.sheet) return '';
  var close = function(){ set({ sheet:null }); };
  var title = '', text = '', items = [];
  var sh = S.sheet;
  if (false) {
    var k = sh.box, cur = S.boxes[k];
    title = 'タグ' + (k+1) + ' に使うタググループ';
    text = cur ? '今は「' + esc(S.groups[cur].name) + '」です。変えても、付けたタグは消えません（未使用のタググループに移ります）。' : '使うタググループを選んでください。';
    if (cur) items.push({ label:S.groups[cur].name, sub:'使用中', cur:true, go:close });
    unusedIds().forEach(function(id){ items.push({ label:S.groups[id].name, sub:S.groups[id].opts.length + '個', go:function(){ var b = S.boxes.slice(); b[k] = id; set({ boxes:b, sheet:null }); } }); });
    S.boxes.forEach(function(id, j){ if (id && j !== k) items.push({ label:S.groups[id].name, sub:'タグ' + (j+1) + 'と入れ替える', go:function(){ var b = S.boxes.slice(); b[j] = b[k]; b[k] = id; set({ boxes:b, sheet:null }); } }); });
    items.push({ label:'＋ 新しいタググループを作る', gold:true, go:function(){
      var nid = 'new' + (S.seq++); S.groups[nid] = { name:'新しいタググループ', opts:[], search:true, ghosts:[] };
      var b = S.boxes.slice(); b[k] = nid; S.boxes = b; S.sheet = null; openGroup(nid); S.optsOpen = true; render();
    } });
    if (cur) items.push({ label:'未設定にする', sub:'', go:function(){ var b = S.boxes.slice(); b[k] = null; set({ boxes:b, sheet:null }); } });
  } else if (sh.kind === 'copy') {
    var T = S.groups[sh.to];
    title = '「' + T.name + '」に選択肢をコピー';
    if (!sh.from) {
      text = 'どのタググループからコピーしますか？ 動画のタグには触りません。';
      allIds().forEach(function(id){ if (id !== sh.to) items.push({ label:label(id), sub:S.groups[id].opts.length + '個', go:function(){ S.sheet = { kind:'copy', to:sh.to, from:id }; S.cPicks = S.groups[id].opts.filter(function(v){ return T.opts.indexOf(v) < 0; }); render(); } }); });
    } else {
      var F = S.groups[sh.from];
      text = '「' + esc(F.name) + '」の選択肢から、写すものを選んでください。<div class="chips" style="padding:8px 0 0">' + F.opts.map(function(v){ var hs = T.opts.indexOf(v) >= 0, pk = S.cPicks.indexOf(v) >= 0; return '<button class="chip' + (hs?' has':(pk?' on':'')) + '" ' + on(function(){ if (hs) return; S.cPicks = pk ? S.cPicks.filter(function(x){ return x !== v; }) : S.cPicks.concat([v]); render(); }) + '>' + (hs?'追加済み ':(pk?'✓ ':'')) + esc(v) + '</button>'; }).join('') + '</div>';
      if (S.cPicks.length) items.push({ label:'選んだ' + S.cPicks.length + '個をコピー', gold:true, go:function(){ var sn = snap(), n = S.cPicks.length; S.cPicks.forEach(function(v){ if (T.opts.indexOf(v) < 0) T.opts.push(v); }); toast(n + '個を「' + T.name + '」にコピーしました', sn); set({ sheet:null, cPicks:[] }); } });
    }
  } else if (sh.kind === 'merge') {
    var A = S.groups[sh.from];
    title = '「' + A.name + '」をマージ';
    if (!sh.to) {
      text = 'どのタググループにまとめますか？';
      allIds().forEach(function(id){ if (id !== sh.from) items.push({ label:label(id), sub:S.groups[id].opts.length + '個', go:function(){ set({ sheet:{ kind:'merge', from:sh.from, to:id } }); } }); });
    } else {
      var B = S.groups[sh.to], same = A.opts.filter(function(v){ return B.opts.indexOf(v) >= 0; });
      var nA = A.opts.reduce(function(n, v){ return n + cnt(sh.from, v); }, 0), ka = S.boxes.indexOf(sh.from);
      text = '「' + esc(A.name) + '」の選択肢' + A.opts.length + '個と、動画に付いているタグ（延べ' + nA + '本）を「' + esc(B.name) + '」に移します。' + (same.length ? '同じ名前の' + same.length + '個（' + same.map(esc).join('・') + '）は1つにまとめます。' : '') + '「' + esc(A.name) + '」は無くなります' + (ka >= 0 ? '（タグ' + (ka+1) + 'は未設定になります）' : '') + '。先にバックアップを保存します。';
      items.push({ label:'マージする', gold:true, go:function(){
        var sn = snap(), nmA = A.name, nmB = B.name, to = sh.to, from = sh.from;
        A.opts.forEach(function(v){ if (B.opts.indexOf(v) < 0) B.opts.push(v); });
        A.ghosts.forEach(function(gh){ if (!B.ghosts.some(function(x){ return x[0] === gh[0]; })) B.ghosts.push(gh); });
        delete S.groups[from]; S.boxes = S.boxes.map(function(x){ return x === from ? null : x; });
        toast('「' + nmA + '」を「' + nmB + '」にマージしました', sn); set({ sheet:null, exp:to });
      } });
    }
  } else if (sh.kind === 'unused') {
    title = '未使用のタググループ';
    text = 'タグ1〜4 に使っていないタググループです。付けたタグは動画に残っています。使うときは、タグの［変更］から選びます。';
    unusedIds().forEach(function(id){ items.push({ label:S.groups[id].name, sub:subOf(S.groups[id]) + '　編集 ›', go:function(){ openGroup(id); } }); });
    if (!unusedIds().length) text += '<br>今はありません。';
  } else if (sh.kind === 'rmopt') {
    var g = S.groups[sh.id];
    title = '「' + sh.v + '」を選択肢から外す';
    text = sh.n + '本の動画に付いています。';
    items.push({ label:'選択肢からだけ外す（動画には残す）', sub:'', go:function(){ var sn = snap(); g.opts = g.opts.filter(function(x){ return x !== sh.v; }); g.ghosts.push([sh.v, sh.n]); toast('「' + sh.v + '」を選択肢から外しました（動画には残っています）', sn); set({ sheet:null }); } });
    items.push({ label:'動画からも外す（' + sh.n + '本）', red:true, go:function(){ var sn = snap(); g.opts = g.opts.filter(function(x){ return x !== sh.v; }); toast('「' + sh.v + '」を選択肢と' + sh.n + '本の動画から外しました', sn); set({ sheet:null }); } });
  } else if (sh.kind === 'defone') {
    var key = sh.key, dg = S.groups[key], miss = missingDefaults(key);
    title = '「' + DEF[key].name + '」を初期値に戻す';
    text = dg ? '名前を「' + DEF[key].name + '」にし、足りない初期値' + (miss.length ? ' ' + miss.length + '個（' + miss.map(esc).join('・') + '）' : '（なし）') + 'を足します。自分で足した選択肢はそのまま残ります。動画のタグには触りません。'
              : '削除されているので、初期値で作り直します（未使用のタググループに入ります）。';
    items.push({ label: dg ? '初期値に戻す' : '作り直す', gold:true, go:function(){
      var sn = snap();
      if (!dg) S.groups[key] = { name:DEF[key].name, opts:DEF[key].vals.slice(), search:DEF[key].search, ghosts:[], def:key };
      else { dg.name = DEF[key].name; miss.forEach(function(v){ dg.opts.push(v); }); }
      toast('「' + DEF[key].name + '」を初期値に戻しました', sn); set({ sheet:null });
    } });
  } else if (sh.kind === 'dupe') {
    var others = sh.ids.filter(function(x){ return x !== sh.keep; });
    title = '「' + sh.v + '」を「' + S.groups[sh.keep].name + '」に寄せる';
    text = others.map(function(id){ return esc(label(id)) + ' の「' + esc(sh.v) + '」' + cnt(id, sh.v) + '本'; }).join('・') + ' を、' + esc(label(sh.keep)) + ' の「' + esc(sh.v) + '」に付け替えます。' + others.map(function(id){ return esc(S.groups[id].name); }).join('・') + ' の選択肢からは外れます。先にバックアップを保存します。';
    items.push({ label:'寄せる', gold:true, go:function(){ var sn = snap(); others.forEach(function(id){ S.groups[id].opts = S.groups[id].opts.filter(function(x){ return x !== sh.v; }); }); toast('「' + sh.v + '」を「' + S.groups[sh.keep].name + '」に寄せました', sn); set({ sheet:null }); } });
  } else if (sh.kind === 'reset') {
    title = '初期設定に戻す';
    text = 'タグ1 トップ/ボトム・タグ2 ポジション・タグ3 マーク・タグ4 未設定、にします。今使っているほかのタググループは「未使用のタググループ」に移ります。<b style="color:var(--text)">付けたタグは消えません。</b>';
    items.push({ label:'初期設定に戻す', gold:true, go:function(){
      var sn = snap();
      ['tb','pos','mark'].forEach(function(key){ if (!S.groups[key]) S.groups[key] = { name:DEF[key].name, opts:DEF[key].vals.slice(), search:DEF[key].search, ghosts:[], def:key }; S.groups[key].name = DEF[key].name; });
      toast('初期設定に戻しました', sn);
      set({ boxes:['tb','pos','mark',null], sheet:null });
    } });
  }
  var h = '<div class="ov" ' + on(function(e){ if (e.target.classList.contains('ov')) close(); }) + '><div class="sheet"><div class="sh-h"><div class="sh-t">' + esc(title) + '</div><button class="x" aria-label="閉じる" ' + on(close) + '>✕</button></div><div class="sh-b"><div class="p">' + text + '</div>';
  items.forEach(function(it){ h += '<button class="pick' + (it.cur ? ' curpick' : '') + '" ' + on(it.go) + '><span class="grow" style="color:' + (it.gold ? 'var(--gold)' : (it.red ? 'var(--red)' : 'var(--text)')) + '">' + (it.cur ? '✓ ' : '') + esc(it.label) + '</span><small>' + esc(it.sub||'') + '</small></button>'; });
  h += '<button class="btn-plain" style="padding:12px;border-radius:9px;font-size:14px" ' + on(close) + '>' + (sh.kind === 'unused' ? '閉じる' : 'キャンセル') + '</button></div></div></div>';
  return h;
}
function viewToast(){
  if (!S.toast) return '';
  return '<div class="toast"><span>' + esc(S.toast.text) + '</span><button ' + on(function(){ var sn = S.toast.snap; S.groups = sn.groups; S.boxes = sn.boxes; S.toast = null; render(); }) + '>元に戻す</button><button aria-label="閉じる" style="color:var(--sub)" ' + on(function(){ S.toast = null; render(); }) + '>✕</button></div>';
}

function viewVideo(){
  var V = S.vid;
  var h = '<div class="wrap"><div class="vid">[動画]</div><div class="h" style="font-size:17px;margin-top:12px">03.ダブルアンダー・ニーカット</div>';
  S.boxes.forEach(function(id, k){
    if (!id) return;
    var g = S.groups[id], c = V.cleared ? [] : g.opts.slice(0, 1);
    h += '<div class="vr"><span class="l">タグ' + (k+1) + ' ' + esc(g.name) + '</span><div class="cs">' + (c.length ? c.map(function(x){ return '<span class="vc">' + esc(x) + '</span>'; }).join('') : '<span style="color:var(--dim);font-size:13px;padding-top:5px">—</span>') + '</div></div>';
  });
  var hd = unusedIds();
  if (hd.length) h += '<div class="note">' + (V.cleared ? '未使用のタググループのタグも外しました。' : '未使用のタググループ（' + hd.map(function(id){ return esc(S.groups[id].name); }).join('・') + '）のタグは画面に出ていませんが、付いたままです。') + '</div>';
  if (!V.asking) h += '<button class="ghost" style="margin-top:14px" ' + on(function(){ V.asking = true; render(); }) + '>この動画のタグをすべてクリア</button>';
  else h += '<div class="confirm" style="margin-top:14px"><p>この動画に付いているタグを、未使用のタググループの分も含めて、すべて外します。ほかの動画は変わりません。</p><div class="two"><button class="btn-plain" ' + on(function(){ V.asking = false; render(); }) + '>キャンセル</button><button class="btn-red" ' + on(function(){ V.asking = false; V.cleared = true; V.toast = true; render(); }) + '>すべて外す</button></div></div>';
  h += '</div>';
  if (V.toast) h += '<div class="toast"><span>タグをすべて外しました</span><button ' + on(function(){ V.cleared = false; V.toast = false; render(); }) + '>元に戻す</button></div>';
  return h;
}

function viewCol(){
  var T = [['checkbox','☐','チェックボックス'],['select','▾','セレクト'],['multi','≡','マルチセレクト'],['tracker','●','トラッカー'],['text','T','テキスト'],['num','#','数値'],['bar','%','進捗バー'],['rate','★','評価'],['count','+1','カウント',1]];
  var h = '<div class="wrap"><div class="sheet" style="padding:18px"><div class="h" style="margin:0 0 14px">列を追加</div><div class="grid">';
  T.forEach(function(t){ h += '<button class="ct' + (S.col === t[0] ? ' on' : '') + '" ' + on(function(){ set({ col:t[0] }); }) + '><span class="ic">' + t[1] + '</span><span class="grow">' + t[2] + '</span>' + (t[3] ? '<span class="new">新</span>' : '') + '</button>'; });
  h += '</div><div class="note" style="min-height:40px">' + (S.col === 'count' ? 'タップするたびに練習回数が1増え、最後に数えた日も表示されます。これまでの練習回数はそのまま使えます（どのリストに追加しても同じ回数です）。' : '') + '</div>';
  h += '<div class="two" style="margin-top:12px"><button class="btn-plain">キャンセル</button><button class="btn-gold">追加する</button></div></div></div>';
  return h;
}

function render(){
  H = {}; hid = 0;
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === S.tab); });
  app.innerHTML = S.tab === 'set' ? viewSettings() : (S.tab === 'vid' ? viewVideo() : viewCol());
}
document.addEventListener('click', function(e){
  var t = e.target.closest('.tab');
  if (t) { set({ tab:t.dataset.tab, open:null, sheet:null }); return; }
  var el = e.target.closest('[data-h]');
  if (!el) return;
  // オーバーレイは背景そのものを押したときだけ閉じる
  if (el.classList.contains('ov') && e.target !== el) return;
  var fn = H[el.getAttribute('data-h')];
  if (fn) fn(e);
});
document.addEventListener('change', function(e){
  if (e.target.dataset && e.target.dataset.slotof) {
    var id = e.target.dataset.slotof, j = +e.target.value, b = S.boxes.slice(), from = b.indexOf(id);
    if (j < 0) { if (from >= 0) b[from] = null; }
    else { var prev = b[j]; b[j] = id; if (from >= 0) b[from] = (prev && prev !== id) ? prev : null; }
    S.boxes = b; render(); return;
  }
  if (e.target.dataset && e.target.dataset.sel) { S[e.target.dataset.sel] = e.target.value; if (e.target.dataset.sel === 'mFrom' && S.mTo === S.mFrom) S.mTo = ''; if (e.target.dataset.sel === 'cFrom' && S.cTo === S.cFrom) S.cTo = ''; if (e.target.dataset.sel.charAt(0) === 'c') S.cPicks = []; render(); return; }
  if (e.target.dataset && e.target.dataset.rename) { var v = e.target.value.trim(), gid = e.target.dataset.rename; if (v && S.groups[gid]) S.groups[gid].name = v; render(); }
});
document.addEventListener('input', function(e){ if (e.target.id === 'draft') S.draft = e.target.value; });
render();
})();
</script>
</body>
</html>
