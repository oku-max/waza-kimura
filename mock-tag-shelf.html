<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOCK — タグ設定（タグ編集つき）</title>
<!--
  見本の画面。本物のデータには一切書き込まない（localStorage も Firestore も触らない）。
  この端末に保存されているタグ設定（wk_tagSettings）を「読むだけ」して、グループ名と選択肢を本物に近づける。
  触った結果はこのページの中だけで、閉じれば消える。
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1c1c1e;--card:#2c2c2e;--field:#38383a;--bd:#48484a;--line:#3a3a3c;--text:#e5e5e7;--sub:#9a9aa0;--dim:#6e6e73;--gold:#e5c47a;--red:#ff8080}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'DM Sans','Hiragino Sans','Noto Sans JP',-apple-system,sans-serif;max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:40px}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
.banner{background:#3a2f12;color:#f3dc9f;font-size:12px;line-height:1.6;padding:10px 16px}
.tabs{display:flex;gap:6px;padding:12px 16px 4px;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{flex:1;padding:9px 6px;border-radius:9px;border:1px solid var(--bd);background:none;font-size:12px;color:var(--sub)}
.tab.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.wrap{padding:12px 16px}
.h{font-size:20px;font-weight:700;margin:6px 0 2px}
.cap{font-size:12px;color:var(--sub);margin:18px 2px 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 14px}
.row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.num{font-size:11px;font-weight:700;color:#1a1a1a;background:var(--gold);border-radius:6px;padding:3px 7px;flex-shrink:0}
.num.off{background:var(--dim)}
.rbtn{flex:1;min-width:0;background:none;border:none;text-align:left;padding:14px 0}
.rn{font-size:16px;font-weight:600}
.rs{font-size:12px;color:var(--sub);margin-top:2px}
.chev{background:none;border:none;color:var(--sub);font-size:18px;padding:14px 4px}
.swb{background:none;border:none;padding:10px 0;flex-shrink:0}
.pill.ghostpill{border-color:var(--bd);color:var(--text);font-weight:400}
.btns{display:flex;gap:6px;flex-shrink:0}
.curpick{border-color:var(--gold)}
.pill{padding:8px 13px;border-radius:9px;border:1px solid var(--gold);background:none;color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0}
.big{width:100%;display:flex;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:15px 14px;text-align:left;font-size:14px;margin-top:18px}
.big span:first-child{flex:1}
.note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:48px 12px 20px;overflow-y:auto}
.sheet{width:100%;max-width:560px;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.sh-h{display:flex;align-items:center;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
.sh-t{flex:1;font-size:16px;font-weight:700}
.x{background:none;border:none;color:var(--sub);font-size:20px;padding:4px 8px}
.sh-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12px;color:var(--sub);margin-bottom:6px;display:block}
.inp{width:100%;background:var(--field);border:1.5px solid var(--bd);border-radius:9px;padding:12px 10px;font-size:15px}
.acc{width:100%;display:flex;align-items:center;gap:8px;background:var(--field);border:1.5px solid var(--bd);border-radius:9px;padding:13px 12px;text-align:left;font-size:14px}
.acc.on{border-color:var(--gold)}
.acc .grow{flex:1}
.acc .c{font-size:13px;color:var(--sub)}
.acc .car{font-size:12px;color:var(--gold)}
.box{margin-top:8px;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.list{max-height:240px;overflow-y:auto}
.li{display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border-bottom:1px solid var(--line)}
.li span{flex:1;font-size:14px;padding:12px 0}
.li button{background:none;border:none;color:var(--sub);font-size:16px;padding:12px 10px}
.addrow{display:flex;gap:7px;padding:10px;background:var(--field);border-top:1px solid var(--bd)}
.addrow input{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--bd);border-radius:9px;padding:10px;font-size:14px}
.gold{padding:10px 16px;border-radius:9px;border:none;background:var(--gold);color:#1a1a1a;font-size:13px;font-weight:700}
.tp{border-bottom:1px solid var(--line)}
.tp-h{width:100%;display:flex;align-items:center;background:none;border:none;text-align:left;padding:12px}
.tp-h .grow{flex:1}
.tp-h .n{display:block;font-size:14px}
.tp-h .s{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px}
.chip{padding:7px 12px;border-radius:16px;border:1px solid #5a5a5c;background:none;font-size:13px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1a1a}
.chip.has{border-color:var(--line);color:var(--dim);cursor:default}
.apply{margin:12px;width:calc(100% - 24px);padding:11px;border-radius:9px;border:none;font-size:13px;font-weight:700;background:var(--line);color:var(--dim)}
.apply.ok{background:var(--gold);color:#1a1a1a}
.sw{width:48px;height:28px;border-radius:14px;background:var(--bd);display:flex;align-items:center;justify-content:flex-start;flex-shrink:0}
.sw.on{background:var(--gold);justify-content:flex-end}
.sw i{width:22px;height:22px;border-radius:11px;background:#fff;margin:0 3px;display:block}
.sep{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ghost{padding:12px;border-radius:9px;border:1px solid var(--bd);background:none;font-size:14px;text-align:left}
.ghost small{color:var(--sub);font-size:12px}
.danger{padding:12px;border-radius:9px;border:1px solid var(--red);background:none;color:var(--red);font-size:14px;text-align:left}
.confirm{border:1px solid var(--red);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{font-size:13px;color:#ffb3b3;line-height:1.6}
.two{display:flex;gap:8px}
.two button{flex:1;padding:11px;border-radius:9px;font-size:14px}
.btn-plain{border:1px solid var(--bd);background:none}
.btn-red{border:none;background:var(--red);color:#1a1a1a;font-weight:700}
.btn-gold{border:none;background:var(--gold);color:#1a1a1a;font-weight:700}
.pick{width:100%;display:flex;align-items:center;gap:8px;background:var(--field);border:1.5px solid var(--bd);border-radius:9px;padding:13px 12px;text-align:left;font-size:14px}
.pick .grow{flex:1}.pick small{color:var(--sub);font-size:12px}
.p{font-size:13px;color:var(--sub);line-height:1.7}
.vid{height:190px;background:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.vr{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.vr .l{font-size:12px;color:var(--sub);width:96px;flex-shrink:0;padding-top:6px}
.vr .cs{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.vc{padding:5px 11px;border-radius:14px;background:var(--field);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;width:calc(100% - 32px);max-width:560px;background:var(--field);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:30}
.toast span{flex:1;font-size:14px}
.toast button{background:none;border:none;color:var(--gold);font-weight:700;font-size:14px;padding:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ct{display:flex;align-items:center;gap:8px;padding:13px 10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--field);font-size:14px;text-align:left}
.ct.on{border-color:var(--gold);background:rgba(229,196,122,.12)}
.ct .ic{width:22px;text-align:center;color:var(--sub)}
.ct .grow{flex:1}
.new{font-size:10px;color:#1a1a1a;background:var(--gold);border-radius:4px;padding:1px 5px}

.badge{font-size:11px;font-weight:700;color:#1a1a1a;background:var(--gold);border-radius:10px;padding:2px 8px;margin-left:6px}
.big small{font-weight:400}
.warn{font-size:12px;color:#f3dc9f;background:#3a2f12;padding:9px 12px;line-height:1.6}
.secbox{display:flex;flex-direction:column}
.secin{border:1px solid var(--bd);border-top:none;border-radius:0 0 9px 9px;padding:12px;margin-top:-4px;display:flex;flex-direction:column;gap:4px}
.sel{width:100%;background:var(--field);border:1.5px solid var(--bd);border-radius:9px;padding:11px 10px;font-size:14px;color:var(--text)}
.dup{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.pill.redpill{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div class="banner">見本の画面です。ここで操作しても、本物のタグや動画は変わりません（閉じると元に戻ります）。グループ名と選択肢は、この端末に保存されている設定を読み込んで表示しています。</div>
<div class="tabs">
  <button class="tab" data-tab="set">タグ設定</button>
  <button class="tab" data-tab="vid">動画のタグをクリア</button>
  <button class="tab" data-tab="col">列を追加</button>
</div>
<div id="app"></div>

<script>
(function(){
'use strict';
// ── この端末のタグ設定を「読むだけ」。書き込みはしない ──
function readSettings(){
  try { var p = JSON.parse(localStorage.getItem('wk_tagSettings') || 'null'); return Array.isArray(p) ? p : null; }
  catch(e){ return null; }
}
var real = readSettings();
var FALL = {
  tb:{name:'TOP/BOTTOM', opts:['トップ','ボトム','スタンディング']},
  cat:{name:'Category', opts:['エスケープ・ディフェンス','コンセプト・原理','パスガード','スイープ','フィニッシュ']},
  pos:{name:'Position', opts:['クローズドガード','デラヒーバ','ハーフガード','スパイダー','ラッソー']},
  tags:{name:'テクニック', opts:['アームバー','キムラ','三角絞め','ベリンボロ']}
};
function fromReal(key){
  var t = real && real.find(function(x){ return x && x.key === key; });
  if (!t) return { name: FALL[key].name, opts: FALL[key].opts.slice() };
  return { name: (t.label && String(t.label).trim()) || FALL[key].name, opts: Array.isArray(t.presets) ? t.presets.slice() : [] };
}
function grp(key, extra){ var g = fromReal(key); return Object.assign({ name:g.name, opts:g.opts, search:true }, extra||{}); }

// 初期のタググループ（まっさらから始めた人が持っているもの）。「初期設定に戻す」の基準
var DEF = {
  tb:   { name:'トップ/ボトム', vals:['トップ','ボトム','スタンディング'], search:true },
  pos:  { name:'ポジション', vals:['クローズドガード','デラヒーバ','ハーフガード','スパイダー','ラッソー','バタフライ','Xガード','マウント','サイド','バック'], search:true },
  mark: { name:'マーク', vals:['⭐ お気に入り','🎯 Next','🟣 ドリル'], search:false },
  prog: { name:'習得', vals:['未着手','理解','練習中','マスター'], search:false }
};
// この端末に保存されている旧テンプレート（編集したことがある人だけ）を「読むだけ」
function readOldTemplates(){
  try { var p = JSON.parse(localStorage.getItem('wk_tagTemplates') || 'null'); return (p && Array.isArray(p.list)) ? p.list : []; }
  catch(e){ return []; }
}
var S = {
  tab: 'set',
  // タグ1〜4 は常に4つ。中身はタググループか、未設定（null）
  boxes: ['tb','cat','pos','tags'],
  groups: {
    tb: grp('tb',{def:'tb'}), cat: grp('cat'), pos: grp('pos',{def:'pos'}), tags: grp('tags'),
    mark: { name:'マーク', opts:DEF.mark.vals.slice(), search:false, def:'mark' },
    prog: { name:'習得', opts:DEF.prog.vals.slice(), search:false, def:'prog' }
  },
  open:null, sheet:null, ed:false, edSec:null, optsOpen:false, confirmDel:false, draft:'', addNote:'', seq:1, toast:null,
  mFrom:'', mTo:'', cFrom:'', cTo:'', cPicks:[],
  vid:{ cleared:false, asking:false },
  col:'count'
};
Object.keys(S.groups).forEach(function(id){ S.groups[id].ghosts = []; });
// 見本: 選択肢に無いタグ・2つのタググループにある同じ名前
S.groups.cat.ghosts = [['ドリル',4]];
S.groups.pos.ghosts = [['コンバットベース',19],['幽霊ポジション',1]];
if (S.groups.tags.opts.indexOf('十字絞め') < 0) S.groups.tags.opts.push('十字絞め');
if (S.groups.pos.opts.indexOf('十字絞め') < 0) S.groups.pos.opts.push('十字絞め');
readOldTemplates().forEach(function(t, i){
  if (!t || !Array.isArray(t.values)) return;
  S.groups['tpl' + i] = { name:String(t.name||'テンプレート') + '（旧テンプレート）', opts:t.values.slice(), search:true, ghosts:[] };
});
// 本数は見本の数字（名前から決まる固定の数）
function cnt(gid, v){ var h = 0; String(gid + v).split('').forEach(function(c){ h = (h * 31 + c.charCodeAt(0)) % 997; }); return h % 28 + 1; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function snap(){ return { groups:clone(S.groups), boxes:S.boxes.slice() }; }
function toast(text, sn){ S.toast = { text:text, snap:sn }; }

var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
var app = document.getElementById('app');
var H = {}; var hid = 0;
function on(fn){ var k = 'h' + (hid++); H[k] = fn; return 'data-h="' + k + '"'; }
function unusedIds(){ return Object.keys(S.groups).filter(function(id){ return S.boxes.indexOf(id) < 0; }); }
function allIds(){ return S.boxes.filter(Boolean).concat(unusedIds()); }
function label(id){ var k = S.boxes.indexOf(id); return (k >= 0 ? 'タグ' + (k+1) + ' ' : '') + S.groups[id].name; }
function set(p){ Object.assign(S, p); render(); }
function sw(onv){ return '<span class="sw' + (onv?' on':'') + '"><i></i></span>'; }
function subOf(g){ return g.opts.length + '個' + (g.search ? '' : '・検索の対象外'); }
function openGroup(id){ set({ open:id, sheet:null, optsOpen:false, confirmDel:false, draft:'', addNote:'' }); }
function dupes(){
  var m = {};
  allIds().forEach(function(id){ S.groups[id].opts.forEach(function(v){ (m[v] = m[v] || []).push(id); }); });
  return Object.keys(m).filter(function(v){ return m[v].length > 1; }).map(function(v){ return { v:v, ids:m[v] }; });
}
function ghostCount(){ return allIds().reduce(function(n, id){ return n + S.groups[id].ghosts.length; }, 0); }
function missingDefaults(key){ var g = S.groups[key]; return g ? DEF[key].vals.filter(function(v){ return g.opts.indexOf(v) < 0; }) : DEF[key].vals.slice(); }
function edIssues(){ return dupes().length + ghostCount(); }

function viewSettings(){
  var h = '<div class="wrap"><div class="h">タグ設定</div>';
  h += '<div class="cap">タグ（4つまで使えます）</div><div class="card">';
  S.boxes.forEach(function(id, k){
    var change = function(){ set({ sheet:{ kind:'change', box:k } }); };
    if (!id) {
      h += '<div class="row"><span class="num off">タグ' + (k+1) + '</span><button class="rbtn" ' + on(change) + '><div class="rn" style="color:var(--sub);font-weight:400">未設定</div></button><button class="pill" ' + on(change) + '>設定する</button></div>';
      return;
    }
    var g = S.groups[id];
    h += '<div class="row"><span class="num">タグ' + (k+1) + '</span><button class="rbtn" ' + on(function(){ openGroup(id); }) + '><div class="rn">' + esc(g.name) + '</div><div class="rs">' + subOf(g) + '</div></button><div class="btns"><button class="pill ghostpill" ' + on(function(){ openGroup(id); }) + '>編集</button><button class="pill" ' + on(change) + '>変更</button></div></div>';
  });
  h += '</div><div class="note" style="margin-top:6px">［編集］で名前・選択肢・検索の対象などを直し、［変更］でそのタグに使うタググループを入れ替えます。</div>';
  var iss = edIssues();
  h += '<button class="big" ' + on(function(){ set({ ed:true, edSec:null }); }) + '><span>タグ編集<small style="display:block;color:var(--sub);font-size:12px;margin-top:3px">マージ・コピー・初期値に戻す・重なりやずれの確認</small></span>' + (iss ? '<span class="badge">要確認 ' + iss + '</span>' : '') + '<span style="color:var(--sub);margin-left:8px">›</span></button>';
  h += '<button class="big" style="margin-top:10px" ' + on(function(){ set({ sheet:{ kind:'reset' } }); }) + '><span>初期設定に戻す</span><span style="color:var(--sub)">›</span></button>';
  var un = unusedIds();
  h += '<button class="big" style="margin-top:10px" ' + on(function(){ set({ sheet:{ kind:'unused' } }); }) + '><span>未使用のタググループ</span><span style="color:var(--sub);margin-right:8px">' + un.length + '</span><span style="color:var(--sub)">›</span></button>';
  h += '<div class="note">「テンプレートから追加」は無くなります。初期のタググループ（トップ/ボトム・ポジション・マーク・習得）がいつもあるので、そこからコピーします。今のテンプレートは「未使用のタググループ」に残ります。<br>「まとめて整理する」と「フィルター設定」も無くなります。本数は見本の数字です。</div></div>';
  return h + viewGroup() + viewEditor() + viewSheet() + viewToast();
}

// ── タググループの編集（名前・選択肢・検索の対象・削除）──
function viewGroup(){
  if (!S.open || !S.groups[S.open]) return '';
  var id = S.open, g = S.groups[id], k = S.boxes.indexOf(id);
  var close = function(){ set({ open:null, confirmDel:false, addNote:'' }); };
  var h = '<div class="ov" ' + on(function(e){ if (e.target.classList.contains('ov')) close(); }) + '><div class="sheet">';
  h += '<div class="sh-h">' + (k >= 0 ? '<span class="num">タグ' + (k+1) + '</span>' : '<span class="num off">未使用</span>') + '<div class="sh-t">' + esc(g.name) + ' を編集</div><button class="x" aria-label="閉じる" ' + on(close) + '>✕</button></div><div class="sh-b">';
  h += '<div><label class="lbl" for="gname">タググループ名</label><input id="gname" class="inp" value="' + esc(g.name) + '" data-rename="1"></div>';
  h += '<div><button class="acc' + (S.optsOpen?' on':'') + '" ' + on(function(){ set({ optsOpen:!S.optsOpen, addNote:'' }); }) + '><span class="grow">選択肢</span><span class="c">' + g.opts.length + '個</span><span class="car">' + (S.optsOpen?'▲':'▼') + '</span></button>';
  if (S.optsOpen) {
    h += '<div class="box"><div class="list">';
    g.opts.forEach(function(o){
      var n = cnt(id, o);
      h += '<div class="li"><span>' + esc(o) + '</span><small style="color:var(--sub);font-size:12px">' + n + '本</small><button aria-label="選択肢から外す" ' + on(function(){ set({ sheet:{ kind:'rmopt', id:id, v:o, n:n } }); }) + '>×</button></div>';
    });
    if (!g.opts.length) h += '<div class="li"><span style="color:var(--sub)">まだありません</span></div>';
    h += '</div><div class="addrow"><input id="draft" placeholder="選択肢を追加..." aria-label="選択肢を追加" value="' + esc(S.draft) + '"><button class="gold" ' + on(function(){
      var v = (document.getElementById('draft').value||'').trim(); if (!v || g.opts.indexOf(v) >= 0) return;
      var other = allIds().filter(function(x){ return x !== id && S.groups[x].opts.indexOf(v) >= 0; });
      g.opts.push(v); S.draft = '';
      S.addNote = other.length ? '「' + v + '」は ' + other.map(label).join('・') + ' にもあります。別のタグとして追加しました（タグ編集でまとめられます）。' : '';
      render();
    }) + '>追加</button></div>';
    if (S.addNote) h += '<div class="warn">' + esc(S.addNote) + '</div>';
    h += '</div>';
  }
  h += '</div>';
  if (g.ghosts.length) h += '<button class="acc" ' + on(function(){ set({ open:null, ed:true, edSec:'ghost' }); }) + '><span class="grow"><span style="display:block">選択肢に無いタグ ' + g.ghosts.length + '個</span><span style="display:block;font-size:12px;color:var(--sub);margin-top:2px">動画に付いているのに選択肢に無いタグです。タグ編集で確認します</span></span><span class="car">›</span></button>';

function viewSheet(){
  if (!S.sheet) return '';

  var sh = S.sheet;
  if (sh.kind === 'change') {
    var k = sh.box, cur = S.boxes[k];
    title = 'タグ' + (k+1) + ' に使うタググループ';
    text = cur ? '今は「' + esc(S.groups[cur].name) + '」です。変えても、付けたタグは消えません（未使用のタググループに移ります）。' : '使うタググループを選んでください。';
    if (cur) items.push({ label:S.groups[cur].name, sub:'使用中', cur:true, go:close });
    unusedIds().forEach(function(id){ items.push({ label:S.groups[id].name, sub:S.groups[id].opts.length + '個', go:function(){ var b = S.boxes.slice(); b[k] = id; set({ boxes:b, sheet:null }); } }); });
    S.boxes.forEach(function(id, j){ if (id && j !== k) items.push({ label:S.groups[id].name, sub:'タグ' + (j+1) + 'と入れ替える', go:function(){ var b = S.boxes.slice(); b[j] = b[k]; b[k] = id; set({ boxes:b, sheet:null }); } }); });
    items.push({ label:'＋ 新しいタググループを作る', gold:true, go:function(){
      var nid = 'new' + (S.seq++); S.groups[nid] = { name:'新しいタググループ', opts:[], search:true, ghosts:[] };
      var b = S.boxes.slice(); b[k] = nid; S.boxes = b; S.sheet = null; openGroup(nid); S.optsOpen = true; render();

    items.push({ label:'動画からも外す（' + sh.n + '本）', red:true, go:function(){ var sn = snap(); g.opts = g.opts.filter(function(x){ return x !== sh.v; }); toast('「' + sh.v + '」を選択肢と' + sh.n + '本の動画から外しました', sn); set({ sheet:null }); } });
  } else if (sh.kind === 'defone') {
    var key = sh.key, dg = S.groups[key], miss = missingDefaults(key);
    title = '「' + DEF[key].name + '」を初期値に戻す';
    text = dg ? '名前を「' + DEF[key].name + '」にし、足りない初期値' + (miss.length ? ' ' + miss.length + '個（' + miss.map(esc).join('・') + '）' : '（なし）') + 'を足します。自分で足した選択肢はそのまま残ります。動画のタグには触りません。'
              : '削除されているので、初期値で作り直します（未使用のタググループに入ります）。';

      else { dg.name = DEF[key].name; miss.forEach(function(v){ dg.opts.push(v); }); }
      toast('「' + DEF[key].name + '」を初期値に戻しました', sn); set({ sheet:null });
    } });
  } else if (sh.kind === 'dupe') {
    var others = sh.ids.filter(function(x){ return x !== sh.keep; });

  items.forEach(function(it){ h += '<button class="pick' + (it.cur ? ' curpick' : '') + '" ' + on(it.go) + '><span class="grow" style="color:' + (it.gold ? 'var(--gold)' : (it.red ? 'var(--red)' : 'var(--text)')) + '">' + (it.cur ? '✓ ' : '') + esc(it.label) + '</span><small>' + esc(it.sub||'') + '</small></button>'; });

  if (e.target.dataset && e.target.dataset.rename && S.open) { var v = e.target.value.trim(); if (v) S.groups[S.open].name = v; render(); }
});
document.addEventListener('input', function(e){ if (e.target.id === 'draft') S.draft = e.target.value; });
render();
})();
</script>
