<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOCK — ドリル2（マスター／カスタム・同じ区間から複数・アイコン）</title>
<!--
  見本の画面。本物のデータには一切書き込まない（localStorage も Firestore も触らない）。押した結果はこのページの中だけ。
  オーナー（2026-11-13）:
   1 メニューの一覧性 →「ライブラリ機能と同じフィルタUIつかいたい」「マスタードリルとカスタムドリルみたいなのはどう？」
   2 同じブックマーク区間から複数のドリル
   3 ドリルの絵文字がダサい
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f6f4;--surface:#fff;--surface2:#f1f1ef;--accent:#111;--on-accent:#fff;--text:#111;--text2:#555;--text3:#70706c;--border:#e0e0dc;--blue:#1a3a5c;--blue-soft:#edf2f8;--green:#2d6a4f;--green-soft:#edf5f1;--gold-soft:#fdf8e8}
body.dark{--bg:#1c1c1e;--surface:#2c2c2e;--surface2:#38383a;--accent:#e5c47a;--on-accent:#1a1a1a;--text:#e5e5e7;--text2:#ababab;--text3:#9a9aa0;--border:#48484a;--blue:#7ab8e0;--blue-soft:#1e2530;--green:#6bc490;--green-soft:#1e2e24;--gold-soft:#2e2a1e}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'Hiragino Sans','Noto Sans JP',-apple-system,sans-serif;padding-bottom:70px}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}
.banner{background:#3a2f12;color:#f3dc9f;font-size:12px;line-height:1.7;padding:10px 16px}
.steps{display:flex;gap:5px;padding:10px 12px 4px;max-width:1100px;margin:0 auto}
.step{flex:1;padding:8px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--text2);line-height:1.35;text-align:center}
.step b{display:block;font-size:13px;color:var(--text)}
.step.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opts{display:flex;gap:12px;align-items:center;padding:6px 14px;font-size:11px;color:var(--text3);max-width:1100px;margin:0 auto}
.opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
.desc{max-width:1100px;margin:6px auto 10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:12px;line-height:1.75;color:var(--text2)}
.desc b{color:var(--text)}
@media (max-width:1124px){.desc{margin:6px 12px 10px}}
.sub{display:flex;gap:5px;padding:2px 12px 8px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.sub .lbl{font-size:11px;font-weight:700;color:var(--text3);align-self:center}
.sub button{font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2)}
.sub button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* アイコン（3 の候補） */
.ic{display:inline-flex;align-items:center;justify-content:center;vertical-align:-2px}
.ic svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-pill{font-size:9px;font-weight:800;letter-spacing:.06em;border:1.5px solid currentColor;border-radius:4px;padding:0 3px;line-height:1.5}

/* ───── 1: ライブラリと同じ形 ───── */
.app{max-width:1100px;margin:0 auto;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg);display:flex;min-height:560px;position:relative}
@media (max-width:1124px){.app{margin:0 12px}}
.side{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-hd{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700}
.side-hd button{font-size:11px;font-weight:700;padding:5px 9px;border-radius:7px;border:1px solid var(--border);background:var(--surface)}
.sec{padding:10px 12px;border-bottom:1px solid var(--border)}
.sec-l{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:7px;letter-spacing:.04em}
.picker{width:100%;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);font-size:12px;font-weight:700;text-align:left}
.picker span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker small{font-weight:400;color:var(--text3)}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--surface2)}
.seg button{flex:1;border:0;background:transparent;font-size:12px;font-weight:700;padding:6px;border-radius:6px;color:var(--text3)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.srch{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);font-size:13px;margin-bottom:6px}
.acc{border-top:1px solid var(--border)}
.acc>button{width:100%;text-align:left;border:0;background:transparent;padding:10px 4px;font-size:12px;color:var(--text2);display:flex;justify-content:space-between}
.acc .bd{padding:0 4px 10px;display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text2)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip small{opacity:.7;margin-left:3px}
.side-ft{margin-top:auto;padding:10px 12px;border-top:1px solid var(--border)}
.side-ft button{width:100%;font-size:12px;padding:7px;border-radius:999px;border:1px solid var(--border);background:var(--surface)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tbar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.tbar .ttl{font-size:14px;font-weight:700;margin-right:auto;display:flex;align-items:center;gap:6px;min-width:0}
.tbar .ttl small{font-weight:400;color:var(--text3);font-size:11px}
.tbar select{font-size:12px;padding:5px 6px;border-radius:7px;border:1px solid var(--border);background:var(--surface)}
.run{font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px;border:0;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.mob-open{display:none;font-size:12px;padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card .th{aspect-ratio:16/9;background:linear-gradient(135deg,#2a3b55,#14202f);position:relative}
.card .th .rg{position:absolute;right:6px;bottom:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.65);padding:1px 6px;border-radius:4px}
.card .th .mir{position:absolute;left:6px;top:6px;font-size:9px;font-weight:700;background:#f2c94c;color:#111;padding:1px 5px;border-radius:4px}
.card .th .pl{position:absolute;inset:0;margin:auto;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);color:#111;border:0;font-size:14px}
.card .bd{padding:8px 10px;flex:1}
.card .tt{font-size:13px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .mt{font-size:10.5px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mt.old{color:#c0612b}
.card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.card .tags span{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--text2)}
.card .ft{display:flex;border-top:1px solid var(--border)}
.card .ft button{flex:1;border:0;background:transparent;font-size:11px;padding:7px 0;color:var(--text2)}
.card .ft button+button{border-left:1px solid var(--border)}
.tbl-w{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;color:var(--text3);font-weight:700;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
td.t{font-weight:700;white-space:normal;min-width:180px}
td .mi{display:inline-block;font-size:10px;font-weight:700;background:#f2c94c;color:#111;padding:0 5px;border-radius:4px}
td .pl{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface2)}
.empty{padding:30px 16px;text-align:center;color:var(--text3);font-size:13px;line-height:1.8}
.empty b{display:block;color:var(--text);font-size:14px}
/* ピッカー（ライブラリのリスト選びと同じ形） */
.pk-ov{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:8;display:flex;align-items:flex-start;justify-content:flex-start}
.pk{margin:96px 0 0 12px;width:300px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
.pk-sec{font-size:10px;font-weight:700;color:var(--text3);padding:10px 12px 4px;letter-spacing:.04em;display:flex;align-items:center}
.pk-sec span{margin-left:auto;font-weight:400}
.pk-row{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;cursor:pointer;border-top:1px solid var(--border)}
.pk-row:hover{background:var(--surface2)}
.pk-row.on{background:var(--blue-soft)}
.pk-row b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pk-row small{color:var(--text3);font-size:11px;white-space:nowrap}
.pk-row .ed{font-size:11px;border:1px solid var(--border);background:transparent;border-radius:6px;padding:2px 7px;color:var(--text3)}
.pk-new{display:block;width:calc(100% - 24px);margin:8px 12px 12px;font-size:12px;padding:8px;border-radius:8px;border:1px dashed var(--border);background:transparent;color:var(--text2)}
.selbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:8px 12px;font-size:12px;z-index:4;box-shadow:0 6px 20px rgba(0,0,0,.2);white-space:nowrap}
.selbar button{border:0;border-radius:7px;padding:6px 10px;font-size:12px;background:var(--bg);color:var(--text);font-weight:700}
.card .ck{position:absolute;left:6px;bottom:6px;width:20px;height:20px;accent-color:#6b9cff}
@media (max-width:760px){
  .side{position:absolute;inset:0 auto 0 0;z-index:6;box-shadow:4px 0 20px rgba(0,0,0,.2);transform:translateX(-102%);transition:transform .2s}
  .app.drawer .side{transform:none}
  .mob-open{display:inline-block}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}
  .card .tt{font-size:12px}
  .pk{margin-top:60px}
}

/* ───── 2: 同じ区間から複数 ───── */
.vp{max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
@media (max-width:644px){.vp{margin:0 12px}}
.vp-hd{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.vp-hd .l{font-size:11px;font-weight:700;color:var(--text3);margin-right:auto}
.hbtn{font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.bm{border-bottom:1px solid var(--border);padding:6px 4px;position:relative}
.bm-r{display:flex;align-items:center;gap:6px}
.bm .t{font-size:12px;padding:2px 8px;border-radius:5px;border:1.5px solid var(--text);background:transparent;white-space:nowrap}
.bm .n{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:2px 6px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);min-width:28px;justify-content:center}
.dbtn.has{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.dbtn b{font-size:10px}
.star{font-size:14px;color:var(--text3);border:0;background:transparent;width:22px}
.edit{font-size:9px;padding:2px 7px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text3)}
.pop{position:absolute;right:40px;top:30px;z-index:3;width:270px;max-width:calc(100% - 20px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
.pop-h{font-size:10px;font-weight:700;color:var(--text3);padding:8px 10px 4px}
.pop-r{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--border);font-size:12px}
.pop-r b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-r small{color:var(--text3);font-size:10.5px}
.pop-r button{font-size:11px;border:1px solid var(--border);background:transparent;border-radius:6px;padding:2px 7px;color:var(--text2)}
.pop-new{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--border);background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:12px;padding:9px 10px}
.kids{margin:6px 0 2px 30px;border-left:2px solid var(--green);padding-left:8px}
.kid{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 0}
.kid b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kid small{color:var(--text3);font-size:10.5px;white-space:nowrap}
.kid button{font-size:11px;border:1px solid var(--border);background:transparent;border-radius:6px;padding:2px 7px;color:var(--text2)}
.kid-new{font-size:11px;border:1px dashed var(--border);background:transparent;border-radius:6px;padding:4px 8px;color:var(--text2);margin-top:2px}
.card2{margin-top:8px;border:1.5px solid var(--blue);border-radius:10px;padding:10px;font-size:12px}
.card2 .h{font-weight:700;color:var(--blue);margin-bottom:6px}
.card2 input{width:100%;font-size:14px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);margin-bottom:6px}
.card2 .row{display:flex;gap:6px;justify-content:flex-end}
.card2 .row button{font-size:12px;padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:transparent}
.card2 .row .sv{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.note{font-size:11px;color:var(--text3);line-height:1.6;margin-top:8px}

/* ───── 3: アイコン ───── */
.icgrid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:0 12px}
.icc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer}
.icc.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.icc h4{font-size:13px;margin-bottom:2px}
.icc p{font-size:11px;color:var(--text3);margin-bottom:10px;line-height:1.6}
.icc .big{font-size:30px;margin-bottom:10px;color:var(--text)}
.icc .use{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--text2)}
.icc .use>div{display:flex;align-items:center;gap:8px}
.icc .use .k{width:64px;font-size:10px;color:var(--text3)}
.nav{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;background:var(--accent);color:var(--on-accent);padding:3px 9px;border-radius:7px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;font-size:12px;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="banner">見本の画面です。ここで押しても本物のデータは何も変わりません。<br>
上のタブで ①マスター／カスタム ②同じ区間から複数 ③アイコン を切り替えます。③で選んだアイコンは①②にも反映されます。</div>
<div class="steps" id="steps"></div>
<div class="opts"><label><input type="checkbox" id="dk"> ダーク</label></div>
<div id="view"></div>
<div class="toast" id="toast"></div>

<script>
// ───────── 3: アイコンの候補 ─────────
const ICONS = {
  loop:  { name:'A ループ矢印', sub:'ナビの「↻ Drill」と同じ形。繰り返す＝ドリル', svg:'<svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>' },
  bell:  { name:'B ダンベル（線）', sub:'今の 🏋️ と同じ意味を、ほかのアイコンと同じ細い線で', svg:'<svg viewBox="0 0 24 24"><path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3.5 9v6"/><path d="M20.5 9v6"/><path d="M6.5 12h11"/></svg>' },
  once:  { name:'C 区間ループ', sub:'線の上の区間をくり返す絵。「区間を切り出す」が伝わる', svg:'<svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M7 20v-4"/><path d="M17 20v-4"/><path d="M17 14V12a5 5 0 0 0-10 0v1.5"/><path d="M4.5 11.5L7 14l2.5-2.5"/></svg>' },
  pill:  { name:'D 文字だけ「DRILL」', sub:'絵にしない。小さな枠つきの文字', svg:null },
};
let icon = 'loop';
const IC = (k = icon) => ICONS[k].svg ? `<span class="ic">${ICONS[k].svg}</span>` : `<span class="ic ic-pill">DRILL</span>`;

// ───────── データ（にせもの） ─────────
const V = {
  v1:{ t:'デラヒーバ完全ガイド Vol.2', ch:'BJJ Fanatics', pl:'デラヒーバ', tags:['ボトム','デラヒーバ'] },
  v2:{ t:'Leg Drag Masterclass', ch:'Gordon Ryan', pl:'パス', tags:['トップ','パスガード'] },
  v3:{ t:'ガードリテンション入門', ch:'道場の動画', pl:'基礎', tags:['ボトム','リテンション'] },
  v4:{ t:'SLX Fundamentals', ch:'Lachlan Giles', pl:'足関', tags:['ボトム','シングルレッグX'] },
};
const D = [
  { id:'d1', vid:'v1', title:'フックの出し入れ', a:505, b:540, mir:true, sp:.75, last:2, n:18 },
  { id:'d2', vid:'v1', title:'グリップ：袖と足首', a:210, b:250, mir:false, sp:1, last:9, n:6 },
  { id:'d3', vid:'v1', title:'グリップ：袖と足首 2', a:262, b:290, mir:false, sp:1, last:null, n:0 },
  { id:'d4', vid:'v3', title:'エビ → 膝を入れて戻す', a:412, b:441, mir:false, sp:1, last:0, n:31 },
  { id:'d5', vid:'v2', title:'レッグドラッグの足の置き方', a:1265, b:1290, mir:true, sp:.75, last:4, n:8 },
  { id:'d6', vid:'v4', title:'シングルレッグXの入り', a:203, b:231, mir:false, sp:1, last:15, n:22 },
  { id:'d7', vid:'v4', title:'SLX からのスイープ', a:320, b:355, mir:false, sp:.5, last:null, n:0 },
];
const CUSTOM = [
  { id:'c1', name:'朝のガード 15分', ids:['d4','d1','d6'] },
  { id:'c2', name:'パス練の前に', ids:['d5'] },
  { id:'c3', name:'足関の入り', ids:['d6','d7'] },
  { id:'c4', name:'試合前', ids:[] },
];
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1700); };
const ago = d => d == null ? 'まだ' : d === 0 ? '今日' : d === 1 ? '昨日' : d + '日前';

// ───────── 画面の切り替え ─────────
const STEPS = [['lib','① マスター／カスタム','ライブラリと同じ形'],['multi','② 同じ区間から複数','ブックマークの行'],['icon','③ アイコン','🏋️ の代わり']];
let step = 'lib';
function renderSteps(){ document.getElementById('steps').innerHTML = STEPS.map(([k,b,s]) => `<button class="step ${k===step?'on':''}" onclick="go('${k}')"><b>${b}</b>${s}</button>`).join(''); }
function go(k){ step = k; render(); window.scrollTo(0,0); }
function render(){ renderSteps(); ({ lib:renderLib, multi:renderMulti, icon:renderIcon })[step](); }

// ═════════ ① マスタードリル／カスタムドリル ═════════
const L = { list:'master', view:'card', q:'', f:{ ch:new Set(), tag:new Set(), last:'', mir:false }, open:{ ch:true, tag:false, other:false }, pick:false, drawer:false, sort:'old', sel:new Set() };
function scope(){ if (L.list === 'master') return D; const c = CUSTOM.find(x => x.id === L.list); return c.ids.map(id => D.find(d => d.id === id)).filter(Boolean); }
function shown(){
  let arr = scope().filter(d => {
    const v = V[d.vid];
    if (L.q && !(d.title + ' ' + v.t + ' ' + v.ch).toLowerCase().includes(L.q.toLowerCase())) return false;
    if (L.f.ch.size && !L.f.ch.has(v.ch)) return false;
    if (L.f.tag.size && !v.tags.some(t => L.f.tag.has(t))) return false;
    if (L.f.mir && !d.mir) return false;
    if (L.f.last === 'never' && d.last != null) return false;
    if (L.f.last === '7' && !(d.last == null || d.last >= 7)) return false;
    return true;
  });
  if (L.list === 'master' || L.sort !== 'menu') {
    if (L.sort === 'old') arr = [...arr].sort((x, y) => (y.last ?? 999) - (x.last ?? 999));
    if (L.sort === 'n') arr = [...arr].sort((x, y) => y.n - x.n);
    if (L.sort === 'video') arr = [...arr].sort((x, y) => V[x.vid].t.localeCompare(V[y.vid].t) || x.a - y.a);
  }
  return arr;
}
function renderLib(){
  const v = document.getElementById('view');
  const cur = L.list === 'master' ? { name:'マスタードリル' } : CUSTOM.find(c => c.id === L.list);
  const arr = shown(), sc = scope();
  const count = (key, val) => sc.filter(d => key === 'ch' ? V[d.vid].ch === val : V[d.vid].tags.includes(val)).length;
  const chs = [...new Set(sc.map(d => V[d.vid].ch))], tags = [...new Set(sc.flatMap(d => V[d.vid].tags))];
  const nF = L.f.ch.size + L.f.tag.size + (L.f.mir ? 1 : 0) + (L.f.last ? 1 : 0) + (L.q ? 1 : 0);
  v.innerHTML = `
  <div class="desc">ライブラリと同じ形。左に <b>リスト（マスタードリル ▾）</b>・<b>ビュー（カード／テーブル）</b>・<b>フィルター</b>。<br>
  <b>マスタードリル</b>＝全部のドリル（ライブラリの「マスター」）。<b>カスタムドリル</b>＝今のメニュー（ライブラリの「カスタムリスト」）。
  ピッカーで切り替え、右上の <b>▶ 回す</b> で今出ているものを順に回す。フィルターは<b>元の動画</b>のチャンネル・プレイリスト・タグと、その他（やっていない・反転）。
  スマホは左が引き出し（ライブラリと同じ）。</div>
  <div class="app ${L.drawer ? 'drawer' : ''}" id="app">
    <aside class="side">
      <div class="side-hd"><span>${IC()} Drill</span><button onclick="toast('動画パネルのブックマークから作ります')">＋ 作り方</button></div>
      <div class="sec"><div class="sec-l">リスト</div>
        <button class="picker" onclick="L.pick=true;renderLib()">${L.list === 'master' ? '🏠' : '≡'} <span>${esc(cur.name)}</span><small>${sc.length}</small> ▾</button></div>
      <div class="sec"><div class="sec-l">ビュー</div>
        <div class="seg"><button class="${L.view==='card'?'on':''}" onclick="L.view='card';renderLib()">▦ カード</button><button class="${L.view==='table'?'on':''}" onclick="L.view='table';renderLib()">▤ テーブル</button></div></div>
      <div class="sec" style="border-bottom:0"><div class="sec-l">フィルター</div>
        <input class="srch" placeholder="🔍 Search..." value="${esc(L.q)}" oninput="L.q=this.value;renderMainOnly()">
        <div class="acc"><button onclick="L.open.ch=!L.open.ch;renderLib()">チャンネル・プレイリスト <span>${L.open.ch?'▾':'▸'}</span></button>
          ${L.open.ch ? `<div class="bd">${chs.map(c => `<button class="chip ${L.f.ch.has(c)?'on':''}" onclick="tog('ch','${esc(c)}')">${esc(c)}<small>${count('ch',c)}</small></button>`).join('')}</div>` : ''}</div>
        <div class="acc"><button onclick="L.open.tag=!L.open.tag;renderLib()">タグ <span>${L.open.tag?'▾':'▸'}</span></button>
          ${L.open.tag ? `<div class="bd">${tags.map(t => `<button class="chip ${L.f.tag.has(t)?'on':''}" onclick="tog('tag','${esc(t)}')">${esc(t)}<small>${count('tag',t)}</small></button>`).join('')}</div>` : ''}</div>
        <div class="acc"><button onclick="L.open.other=!L.open.other;renderLib()">その他 <span>${L.open.other?'▾':'▸'}</span></button>
          ${L.open.other ? `<div class="bd">
            <button class="chip ${L.f.last==='never'?'on':''}" onclick="L.f.last=L.f.last==='never'?'':'never';renderLib()">まだやっていない</button>
            <button class="chip ${L.f.last==='7'?'on':''}" onclick="L.f.last=L.f.last==='7'?'':'7';renderLib()">1週間以上やっていない</button>
            <button class="chip ${L.f.mir?'on':''}" onclick="L.f.mir=!L.f.mir;renderLib()">⇋ 反転</button></div>` : ''}</div>
      </div>
      <div class="side-ft"><button onclick="Object.assign(L.f,{ch:new Set(),tag:new Set(),last:'',mir:false});L.q='';renderLib()">フィルターをリセット${nF ? `（${nF}）` : ''}</button></div>
    </aside>
    <section class="main">
      <div class="tbar">
        <button class="mob-open" onclick="L.drawer=!L.drawer;renderLib()">☰ ${esc(cur.name)}</button>
        <div class="ttl" id="ttl"></div>
        <select onchange="L.sort=this.value;renderMainOnly()">
          ${L.list !== 'master' ? `<option value="menu" ${L.sort==='menu'?'selected':''}>メニューの順</option>` : ''}
          <option value="old" ${L.sort==='old'?'selected':''}>やっていない順</option>
          <option value="n" ${L.sort==='n'?'selected':''}>回数が多い順</option>
          <option value="video" ${L.sort==='video'?'selected':''}>動画ごと</option>
        </select>
        <button class="run" onclick="toast('▶ ' + document.querySelectorAll('[data-d]').length + '本を順に回す（道場／一覧）')">▶ 回す</button>
      </div>
      <div id="mainBody"></div>
    </section>
    ${L.pick ? pickerHTML() : ''}
    ${L.sel.size ? `<div class="selbar">${L.sel.size}本を選択<button onclick="addToMenu()">カスタムドリルに入れる</button><button onclick="L.sel.clear();renderLib()">解除</button></div>` : ''}
  </div>`;
  renderMainOnly();
}
function renderMainOnly(){
  const arr = shown(), cur = L.list === 'master' ? 'マスタードリル' : CUSTOM.find(c => c.id === L.list).name;
  const ttl = document.getElementById('ttl'); if (ttl) ttl.innerHTML = `${esc(cur)} <small>${arr.length} / ${scope().length}本</small>`;
  const el = document.getElementById('mainBody'); if (!el) return;
  if (!arr.length) { el.innerHTML = L.list !== 'master' && !scope().length
      ? `<div class="empty"><b>このカスタムドリルは空です</b>マスタードリルでチェックを入れて「カスタムドリルに入れる」、<br>またはカードの「⋯」から入れます。</div>`
      : `<div class="empty"><b>0本</b>フィルターで隠れています</div>`; return; }
  if (L.view === 'card') {
    el.innerHTML = `<div class="grid">${arr.map(d => { const v = V[d.vid]; return `<div class="card" data-d="${d.id}">
      <div class="th">${d.mir ? '<span class="mir">⇋ 反転</span>' : ''}<span class="rg">${fmt(d.a)}–${fmt(d.b)} · ${fmt(d.b - d.a)}</span>
        <button class="pl" onclick="toast('▶ ${esc(d.title)} をループ')">▶</button>
        <input type="checkbox" class="ck" ${L.sel.has(d.id)?'checked':''} onchange="this.checked?L.sel.add('${d.id}'):L.sel.delete('${d.id}');renderLib()"></div>
      <div class="bd"><div class="tt">${esc(d.title)}</div>
        <div class="mt">${esc(v.t)}</div>
        <div class="mt ${d.last != null && d.last >= 7 ? 'old' : ''}">${ago(d.last)} · 計${d.n}回${d.sp !== 1 ? ' · ×' + d.sp : ''}</div>
        <div class="tags">${v.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div></div>
      <div class="ft"><button onclick="toast('動画パネルで区間を直す')">区間を直す</button><button onclick="toast('名前を変える／カスタムドリルに入れる／削除')">⋯</button></div>
    </div>`; }).join('')}</div>`;
  } else {
    el.innerHTML = `<div class="tbl-w"><table><thead><tr><th></th><th>ドリル</th><th>元の動画</th><th>区間</th><th>長さ</th><th>反転</th><th>速度</th><th>最後</th><th>回数</th><th>タグ</th></tr></thead><tbody>
      ${arr.map(d => { const v = V[d.vid]; return `<tr data-d="${d.id}"><td><button class="pl" onclick="toast('▶ ${esc(d.title)}')">▶</button></td><td class="t">${esc(d.title)}</td><td>${esc(v.t)}</td><td>${fmt(d.a)}–${fmt(d.b)}</td><td>${fmt(d.b - d.a)}</td>
        <td>${d.mir ? '<span class="mi">⇋</span>' : '—'}</td><td>×${d.sp}</td><td>${ago(d.last)}</td><td>${d.n}</td><td>${v.tags.join('・')}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  }
}
function pickerHTML(){
  const n = id => id === 'master' ? D.length : CUSTOM.find(c => c.id === id).ids.length;
  return `<div class="pk-ov" onclick="if(event.target===this){L.pick=false;renderLib()}"><div class="pk">
    <div class="pk-sec">マスター</div>
    <div class="pk-row ${L.list==='master'?'on':''}" onclick="pickList('master')">🏠 <b>マスタードリル</b><small>${n('master')}本</small></div>
    <div class="pk-sec">カスタムドリル<span>${CUSTOM.length}</span></div>
    ${CUSTOM.map(c => `<div class="pk-row ${L.list===c.id?'on':''}" onclick="pickList('${c.id}')">≡ <b>${esc(c.name)}</b><small>${c.ids.length}本 · ${fmt(c.ids.reduce((s, id) => { const d = D.find(x => x.id === id); return s + (d ? d.b - d.a : 0); }, 0))}</small><button class="ed" onclick="event.stopPropagation();toast('名前を変える／削除')">編集</button></div>`).join('')}
    <button class="pk-new" onclick="newCustom()">＋ 新しいカスタムドリル</button>
  </div></div>`;
}
function pickList(id){ L.list = id; L.pick = false; L.drawer = false; L.sort = id === 'master' ? 'old' : 'menu'; L.sel.clear(); renderLib(); }
function newCustom(){ const id = 'c' + Date.now(); CUSTOM.push({ id, name:'新しいカスタムドリル', ids:[] }); toast('空のカスタムドリルを作りました'); pickList(id); }
function tog(k, v){ L.f[k].has(v) ? L.f[k].delete(v) : L.f[k].add(v); renderLib(); }
function addToMenu(){ const c = CUSTOM[0]; L.sel.forEach(id => { if (!c.ids.includes(id)) c.ids.push(id); }); toast(`「${c.name}」に${L.sel.size}本入れました（本物ではどれに入れるか選ぶ）`); L.sel.clear(); renderLib(); }

// ═════════ ② 同じブックマーク区間から複数 ═════════
const BMS = [
  { t:0, n:'イントロ' }, { t:95, n:'デラヒーバフックの入り方' }, { t:210, n:'グリップ：袖と足首' },
  { t:330, n:'ベリンボロへの入り' }, { t:505, n:'ドリル：フックの出し入れ' }, { t:600, n:'キスオブザドラゴン' },
];
const M = { pat:'A', pop:null, open:new Set([210]), card:null };
const kidsOf = t => D.filter(d => d.vid === 'v1' && d.a >= t && d.a < (BMS[BMS.findIndex(b => b.t === t) + 1]?.t ?? 9e9));
function renderMulti(){
  const v = document.getElementById('view');
  v.innerHTML = `
  <div class="sub"><span class="lbl">見せ方:</span>
    <button class="${M.pat==='A'?'on':''}" onclick="M.pat='A';M.pop=null;M.card=null;renderMulti()">A 押すと小さなメニュー</button>
    <button class="${M.pat==='B'?'on':''}" onclick="M.pat='B';M.pop=null;M.card=null;renderMulti()">B 行の下にぶら下がる</button></div>
  <div class="desc">${M.pat === 'A'
    ? '<b>A</b>: ドリルが無い区間は今までどおり、押せばすぐ作る。ドリルがある区間はアイコンに<b>数</b>が出て、押すと<b>その区間のドリル</b>（▶ で回す・直す）と<b>「＋ この区間でもう1本」</b>の小さなメニュー。一覧はすっきりしたまま。'
    : '<b>B</b>: ドリルがある区間は、ブックマークの<b>すぐ下に</b>その区間のドリルが細く並ぶ（数を押すと開閉）。最後に「＋ この区間でもう1本」。一目で分かるが、行が増える。'}
    名前は2本目から <b>「グリップ：袖と足首 2」</b>（v52.990 の2回押しと同じ決まり）。作るカードは今と同じ（±1秒で端を合わせる）。</div>
  <div class="vp" id="vp">
    <div class="vp-hd"><span class="l">🔖 ブックマーク</span><button class="hbtn">✨ 要約</button><button class="hbtn">${IC()} ここから</button><button class="hbtn">＋ 現在位置でブックマーク</button></div>
    ${BMS.map(b => {
      const ks = kidsOf(b.t), has = ks.length;
      const btn = `<button class="dbtn ${has?'has':''}" onclick="bmTap(${b.t})" title="${has ? 'この区間のドリル' : 'この区間をドリルにする'}">${IC()}${has ? `<b>${has}</b>` : ''}</button>`;
      const pop = M.pat === 'A' && M.pop === b.t ? `<div class="pop"><div class="pop-h">この区間のドリル</div>
        ${ks.map(d => `<div class="pop-r"><b>${esc(d.title)}</b><small>${fmt(d.a)}–${fmt(d.b)}</small><button onclick="toast('▶ ${esc(d.title)}')">▶</button><button onclick="toast('区間を直す')">直す</button></div>`).join('')}
        <button class="pop-new" onclick="newFrom(${b.t})">＋ この区間でもう1本</button></div>` : '';
      const kids = M.pat === 'B' && has && M.open.has(b.t) ? `<div class="kids">
        ${ks.map(d => `<div class="kid">${IC()}<b>${esc(d.title)}</b><small>${fmt(d.a)}–${fmt(d.b)}${d.mir ? ' · ⇋' : ''}</small><button onclick="toast('▶ ${esc(d.title)}')">▶</button><button onclick="toast('区間を直す')">直す</button></div>`).join('')}
        <button class="kid-new" onclick="newFrom(${b.t})">＋ この区間でもう1本</button></div>` : '';
      return `<div class="bm"><div class="bm-r"><button class="t">${fmt(b.t)}</button><span class="n">${esc(b.n)}</span>${btn}<button class="star">☆</button><button class="edit">編集</button></div>${pop}${kids}
        ${M.card === b.t ? `<div class="card2"><div class="h">${IC()} ドリルを作る</div><input value="${esc(nextName(b))}"><div style="font-size:11px;color:var(--text3);margin-bottom:6px">開始 ${fmt(b.t)}　終了 ${fmt(BMS[BMS.indexOf(b) + 1]?.t ?? 900)}（±1秒・今の位置は今と同じ）</div>
          <div class="row"><button onclick="M.card=null;renderMulti()">やめる</button><button class="sv" onclick="saveNew(${b.t})">ドリルに保存</button></div></div>` : ''}</div>`;
    }).join('')}
  </div>`;
}
function nextName(b){ const ks = kidsOf(b.t).filter(d => d.title === b.n || d.title.startsWith(b.n + ' ')); if (!ks.length) return b.n; const max = Math.max(...ks.map(d => Number((d.title.match(/ (\d+)$/) || [0, 1])[1]))); return `${b.n} ${max + 1}`; }
function bmTap(t){
  const has = kidsOf(t).length;
  if (!has) { M.card = t; M.pop = null; return renderMulti(); }
  if (M.pat === 'A') M.pop = M.pop === t ? null : t;
  else M.open.has(t) ? M.open.delete(t) : M.open.add(t);
  M.card = null; renderMulti();
}
function newFrom(t){ M.pop = null; M.card = t; renderMulti(); }
function saveNew(t){ const b = BMS.find(x => x.t === t), nx = BMS[BMS.indexOf(b) + 1]?.t ?? 900;
  D.push({ id:'d' + Date.now(), vid:'v1', title:nextName(b), a:t + (kidsOf(t).length ? 3 : 0), b:nx, mir:false, sp:1, last:null, n:0 });
  M.card = null; M.open.add(t); toast('ドリルに保存しました'); renderMulti(); }

// ═════════ ③ アイコン ═════════
function renderIcon(){
  const v = document.getElementById('view');
  v.innerHTML = `<div class="desc">今の 🏋️（絵文字）の代わり。ほかのボタン（✎ 仕切り・📑 自動チャプター 等）と並べても浮かないよう、<b>細い線の1色</b>にしました。
    押すと選べて、①②の画面にもその場で反映されます。ナビは今「↻ Drill」です。</div>
  <div class="icgrid">${Object.entries(ICONS).map(([k, o]) => `<div class="icc ${icon===k?'on':''}" onclick="icon='${k}';renderIcon()">
    <h4>${o.name}${icon===k ? '　✓ 選択中' : ''}</h4><p>${o.sub}</p>
    <div class="big">${IC(k)}</div>
    <div class="use">
      <div><span class="k">ブックマーク</span><button class="dbtn">${IC(k)}</button><button class="dbtn has">${IC(k)}<b>2</b></button></div>
      <div><span class="k">見出し</span><button class="hbtn">${IC(k)} ここから</button></div>
      <div><span class="k">ナビ</span><span class="nav">${IC(k)} Drill</span></div>
      <div><span class="k">作るカード</span><span style="font-weight:700;color:var(--blue)">${IC(k)} ドリルを作る</span></div>
    </div></div>`).join('')}</div>`;
}

document.getElementById('dk').onchange = e => document.body.classList.toggle('dark', e.target.checked);
if (matchMedia('(prefers-color-scheme: dark)').matches) { document.body.classList.add('dark'); document.getElementById('dk').checked = true; }
render();
</script>
</body>
</html>
