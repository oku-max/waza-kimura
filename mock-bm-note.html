<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOCK — ブックマークの説明メモ（5案）</title>
<!--
  見本の画面。本物のデータには一切書き込まない（localStorage も Firestore も触らない）。
  中身は固定の見本データ。触った結果はこのページの中だけで、閉じれば消える。
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f6f4;--surface:#fff;--surface2:#f1f1ef;--surface3:#e8e8e5;--accent:#111;--gold-soft:#fdf8e8;--text:#111;--text2:#555;--text3:#70706c;--border:#e0e0dc;--border2:#eaeae6}
body.dark{--bg:#1c1c1e;--surface:#2c2c2e;--surface2:#38383a;--surface3:#48484a;--accent:#e5c47a;--gold-soft:#2e2a1e;--text:#e5e5e7;--text2:#ababab;--text3:#9a9aa0;--border:#48484a;--border2:#3a3a3c}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'DM Sans','Hiragino Sans','Noto Sans JP',-apple-system,sans-serif;max-width:620px;margin:0 auto;padding-bottom:60px}
button{font-family:inherit;cursor:pointer;color:inherit}
.banner{background:#3a2f12;color:#f3dc9f;font-size:12px;line-height:1.7;padding:10px 16px}
.tabs{display:flex;gap:5px;padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tab{flex:1;min-width:0;padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;color:var(--text2);white-space:nowrap}
.tab.on{border-color:var(--accent);color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.opts{display:flex;gap:10px;align-items:center;padding:8px 14px;font-size:11px;color:var(--text3)}
.opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
.desc{margin:6px 12px 10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:12px;line-height:1.7;color:var(--text2)}
.desc b{color:var(--text)}
.panel{margin:0 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}

/* 見出し行（共通） */
.hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.lbl{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.04em}
.hbtn{font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);white-space:nowrap}
.hsp{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.all{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.all button{font-size:10.5px;padding:3px 9px;border:none;background:var(--surface);color:var(--text2)}
.all button+button{border-left:1px solid var(--border)}
.all button:hover{background:var(--surface2)}

/* 行（共通） */
.row{border-bottom:1px solid var(--border);padding:6px 4px}
.row:last-child{border-bottom:none}
.line{display:flex;align-items:center;gap:6px}
.t{flex-shrink:0;padding:2px 8px;border-radius:5px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;font-weight:500;white-space:nowrap}
.name{flex:1;min-width:0;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ed{padding:2px 7px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:9.5px;flex-shrink:0}
.note{font-size:11px;line-height:1.65;color:var(--text2);white-space:pre-wrap}
.tog{background:none;border:none;color:var(--text3);flex-shrink:0;line-height:1}

/* A 控えめ: 左の ▸ で開閉。メモは題名の下に小さく */
.A .tog{width:16px;font-size:10px;transition:transform .15s}
.A .tog.open{transform:rotate(90deg)}
.A .tog.none{visibility:hidden}
.A .note{margin:3px 0 1px 22px;color:var(--text3)}

/* B 1行プレビュー: 閉じていても1行だけ見える。押すと全文 */
.B .note{margin:3px 0 0 2px;color:var(--text3);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.B .note::before{content:'▸ ';font-size:9px}
.B .note.open{white-space:pre-wrap;color:var(--text2)}
.B .note.open::before{content:'▾ '}

/* C 💬ボタン: メモがある行だけ右に 💬。開くと左に線のある箱 */
.C .tog{font-size:11px;padding:2px 6px;border-radius:5px;border:1px solid var(--border);background:transparent}
.C .tog.open{background:var(--gold-soft);border-color:var(--accent)}
.C .note{margin:5px 0 2px 8px;padding:2px 0 2px 10px;border-left:2px solid var(--border)}

/* D カード引き出し: 行末の ⌄。開くと薄い背景の箱 */
.D .tog{font-size:14px;width:22px;transition:transform .15s}
.D .tog.open{transform:rotate(180deg)}
.D .tog.none{visibility:hidden}
.D .note{margin:6px 0 2px;padding:7px 10px;background:var(--surface2);border-radius:7px}

/* E タイムライン: 時刻の列を揃え、題名とメモを右の列に。閉じると「…」 */
.E .row{display:grid;grid-template-columns:62px 1fr;column-gap:8px;padding:7px 4px}
.E .t{justify-self:start;align-self:start}
.E .col{min-width:0}
.E .line{gap:6px}
.E .more{font-size:10px;color:var(--text3);background:var(--surface2);border:1px solid var(--border2);border-radius:5px;padding:1px 6px;flex-shrink:0}
.E .note{margin-top:3px;color:var(--text2);border-left:2px solid var(--border2);padding-left:8px}
.hide{display:none}
</style>
</head>
<body>
<div class="banner">見本の画面です。本物のデータには書き込みません。<br>上のタブで5案を切り替えてください。どの案も <b>説明メモの開閉</b> と <b>全部表示／全部隠す</b> が実際に動きます。</div>
<div class="tabs" id="tabs"></div>
<div class="opts">
  <label><input type="checkbox" id="dark"> ダーク表示</label>
  <label><input type="checkbox" id="startOpen"> 最初から全部開いた状態で見る</label>
</div>
<div class="desc" id="desc"></div>
<div class="panel">
  <div class="hd">
    <span class="lbl">🔖 ブックマーク</span>
    <span class="hsp">
      <span class="all" id="allbox"><button onclick="setAll(true)">全部表示</button><button onclick="setAll(false)">全部隠す</button></span>
      <button class="hbtn">📑 自動チャプター</button>
      <button class="hbtn">＋ 現在位置でブックマーク</button>
    </span>
  </div>
  <div id="list"></div>
</div>

<script>
const BMS = [
  { t:'0:00', name:'スマッシュパスの概念', note:'ブルドーザーのようなパスの概念からスマッシュパスの名称と意味を解説する。' },
  { t:'1:17', name:'失敗するスマッシュパス', note:'相手に足を入られたり、スイープされるなど、うまくいかないスマッシュパスの例を挙げる。' },
  { t:'2:02', name:'重いスマッシュパスの作り方', note:'相手のフレームを潰し、胸の寄せ方を意識して重さを生み出すスマッシュパスの基本を説明する。' },
  { t:'3:15', name:'胸の寄せ方が大事', note:'' },
  { t:'3:24', name:'デラヒーバからのパス', note:'デラヒーバガードからのスマッシュパスで、アングルを作り相手の腕をコントロールしてサブミッションやパスに繋げる方法を実演する。' },
  { t:'3:46', name:'☆相手の腕フレームのつぶし方', note:'反対方向へ流してから体に沿ってプレッシャー' },
  { t:'6:41', name:'接近戦スマッシュパス', note:'接近戦でのスマッシュパスにおいて、頭の位置と背骨の向きを揃え、相手の膝を殺してから前に出る。' },
];
const DESIGNS = {
  now: { tab:'いま', desc:'<b>いまの本番。</b>説明メモの文字の指定がPCでは読み込まれておらず、題名より大きい文字で全文が出ている（本当は10px・2行で畳む設計だった）。比較用。' },
  A: { tab:'A 控えめ', desc:'<b>A 控えめ。</b>題名の左の ▸ で開閉。メモは題名より一段小さく、灰色で、題名の下に字下げして出す。閉じると題名だけの一覧になり、いちばん詰まって見える。メモの無い行は ▸ が出ない。' },
  B: { tab:'B 1行だけ', desc:'<b>B 1行だけ見せる。</b>閉じていてもメモの先頭1行が灰色で見える。押すと全文。「中身をちらっと見て、必要なら開く」使い方向け。全部隠すでも1行は残る。' },
  C: { tab:'C 💬ボタン', desc:'<b>C 💬ボタン。</b>メモがある行だけ、編集の左に 💬 が出る。押すと、左に線の入った箱でメモが開く。「どの行にメモがあるか」が一目で分かる。' },
  D: { tab:'D 引き出し', desc:'<b>D 引き出し。</b>行の右端の ⌄ で開閉。開くと薄い背景の箱にメモが入り、題名とはっきり分かれる。文字は題名より小さいが読みやすい大きさ。' },
  E: { tab:'E 時刻の列', desc:'<b>E 時刻の列をそろえる。</b>時刻を左の列に固定し、題名とメモを右の列にまとめる。閉じている時は題名の横に「メモ ▸」、押すと下に開く（開いたメモを押すと閉じる）。長い一覧でも時刻が縦にそろって追いやすい。' },
};
let cur = 'A';
let open = new Set();

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tog(i){ open.has(i) ? open.delete(i) : open.add(i); render(); }
function setAll(v){ open = v ? new Set(BMS.map((b,i)=>i).filter(i=>BMS[i].note)) : new Set(); render(); }

function row(b, i){
  const o = open.has(i), has = !!b.note, n = esc(b.note);
  const t = `<button class="t">${b.t}</button>`, name = `<span class="name">${esc(b.name)}</span>`, ed = `<button class="ed">編集</button>`;
  switch (cur) {
    case 'now':
      return `<div class="row"><div class="line">${t}${name}${ed}</div>${has ? `<div style="font-size:18px;line-height:1.6;margin-top:2px">💬 ${n}</div>` : ''}</div>`;
    case 'A':
      return `<div class="row"><div class="line"><button class="tog ${o?'open':''} ${has?'':'none'}" onclick="tog(${i})">▶</button>${t}${name}${ed}</div>
        ${has && o ? `<div class="note">${n}</div>` : ''}</div>`;
    case 'B':
      return `<div class="row"><div class="line">${t}${name}${ed}</div>
        ${has ? `<div class="note ${o?'open':''}" onclick="tog(${i})">${n}</div>` : ''}</div>`;
    case 'C':
      return `<div class="row"><div class="line">${t}${name}${has ? `<button class="tog ${o?'open':''}" onclick="tog(${i})" title="説明メモ">💬</button>` : ''}${ed}</div>
        ${has && o ? `<div class="note">${n}</div>` : ''}</div>`;
    case 'D':
      return `<div class="row"><div class="line">${t}${name}${ed}<button class="tog ${o?'open':''} ${has?'':'none'}" onclick="tog(${i})">⌄</button></div>
        ${has && o ? `<div class="note">${n}</div>` : ''}</div>`;
    case 'E':
      return `<div class="row">${t}<div class="col"><div class="line">${name}${has && !o ? `<button class="more" onclick="tog(${i})">メモ ▸</button>` : ''}${ed}</div>
        ${has && o ? `<div class="note" onclick="tog(${i})" style="cursor:pointer">${n}</div>` : ''}</div></div>`;
  }
}
function render(){
  document.getElementById('tabs').innerHTML = Object.entries(DESIGNS).map(([k,d]) =>
    `<button class="tab ${k===cur?'on':''}" onclick="pick('${k}')">${d.tab}</button>`).join('');
  document.getElementById('desc').innerHTML = DESIGNS[cur].desc;
  document.getElementById('allbox').classList.toggle('hide', cur === 'now');
  const list = document.getElementById('list');
  list.className = cur;
  list.innerHTML = BMS.map(row).join('');
}
function pick(k){ cur = k; setAll(document.getElementById('startOpen').checked); }
document.getElementById('dark').onchange = e => document.body.classList.toggle('dark', e.target.checked);
document.getElementById('startOpen').onchange = e => setAll(e.target.checked);
render();
</script>
</body>
</html>
