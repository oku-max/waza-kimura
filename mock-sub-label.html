<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字幕ボタンの見せ方 — モック</title>
<style>
  :root{
    --bg:#1c1c1e; --surface:#2c2c2e; --surface2:#38383a;
    --text:#e5e5e7; --text2:#ababab; --text3:#9a9aa0;
    --border:#48484a; --accent:#e5c47a; --on-accent:#1a1a1a;
  }
  body.light{
    --bg:#f6f6f4; --surface:#fff; --surface2:#f1f1ef;
    --text:#111; --text2:#555; --text3:#70706c;
    --border:#e0e0dc; --accent:#111; --on-accent:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
       font-size:14px;line-height:1.6}
  h1{font-size:17px;margin:0 0 6px}
  .lead{font-size:12.5px;color:var(--text2);margin:0 0 14px;max-width:70ch}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:0;
         background:var(--bg);padding:8px 0;z-index:10;border-bottom:1px solid var(--border)}
  .ctrl{padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);
        color:var(--text2);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .ctrl.on{border-color:var(--accent);color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .cap{padding:9px 12px 12px}
  .cap h2{font-size:13px;margin:0 0 3px}
  .cap p{font-size:11.5px;color:var(--text3);margin:0}
  .cap .good{color:var(--text2)}

  /* ── 疑似プレイヤー ───────────────────────────── */
  .player{position:relative;aspect-ratio:16/9;overflow:hidden;
    background:linear-gradient(180deg,#e9e9e6 0%,#dedede 46%,#4a86c8 47%,#2f6fb5 100%)}
  .yt-title{position:absolute;left:8px;top:6px;right:96px;color:#fff;font-size:11px;font-weight:700;
    text-shadow:0 1px 3px rgba(0,0,0,.7);line-height:1.3;pointer-events:none}
  .yt-title span{display:block;font-size:9px;font-weight:400;opacity:.85}
  /* YouTube自身のボタン列（比較用。実際は一時停止で出る） */
  .yt-btns{position:absolute;top:6px;right:8px;display:flex;gap:9px;align-items:center}
  .yt-ic{width:24px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:9px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .yt-ic.box{border:1.6px solid #fff;border-radius:4px}
  .yt-bar{position:absolute;left:0;right:0;bottom:6px;height:3px;background:rgba(255,255,255,.35)}
  .yt-bar i{display:block;height:100%;width:62%;background:#f00}
  /* YouTube純正の字幕（同時に出た場合の比較用） */
  .yt-cc{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;display:none;
    flex-direction:column;align-items:center;gap:2px;width:92%;text-align:center}
  .yt-cc.on{display:flex}
  .yt-cc span{background:rgba(0,0,0,.78);color:#fff;font-size:13px;padding:1px 6px;border-radius:2px}

  /* ── うちの字幕 ───────────────────────────────── */
  .my-cc{position:absolute;left:0;right:0;bottom:32%;display:flex;flex-direction:column;
    align-items:center;gap:2px;padding:0 5%;text-align:center;pointer-events:none}
  .my-cc.hide{display:none}
  .my-cc b{font-weight:400;background:rgba(0,0,0,.78);color:#fff;font-size:13px;padding:1px 7px;
    border-radius:2px;display:inline-block}
  /* D-1 左に色の縦バー */
  .mark-bar b{border-left:3px solid var(--accent);border-radius:0 2px 2px 0;padding-left:7px}
  /* D-3 文字色を変える */
  .mark-color b{color:#f2d79a}
  /* D-2 出し始めだけラベル */
  .flash{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(32% + 32px);
    background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:800;
    padding:2px 8px;border-radius:20px;opacity:0;transition:opacity .3s}
  .flash.show{opacity:1}

  /* ── うちのボタン（案ごと） ───────────────────── */
  .ui{position:absolute;top:40px;right:8px;display:flex;gap:6px;align-items:center;z-index:3}
  .btn{font:inherit;font-size:11px;font-weight:700;line-height:1.5;padding:3px 9px;border-radius:6px;
    cursor:pointer;border:1.5px solid;box-shadow:0 1px 6px rgba(0,0,0,.45);white-space:nowrap}
  .gear{background:rgba(0,0,0,.6);color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.5)}
  /* いまの姿（v52.737） */
  .now-on{background:rgba(255,255,255,.92);color:#111;border-color:#fff}
  .now-off{background:rgba(0,0,0,.6);color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.5)}
  /* 案A: 文字だけ変える */
  .a-on{background:rgba(255,255,255,.92);color:#111;border-color:#fff}
  .a-off{background:rgba(0,0,0,.6);color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.5)}
  /* 案B: 2段バッジ */
  .b-btn{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:3px 9px;line-height:1.25}
  .b-btn em{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.08em;opacity:.9}
  .b-on{background:rgba(20,20,20,.86);color:#fff;border-color:var(--accent)}
  .b-on em{color:var(--accent)}
  .b-off{background:rgba(0,0,0,.6);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.45)}
  /* 案C: 左に色の縦線 */
  .c-btn{display:inline-flex;align-items:center;gap:6px;padding-left:6px}
  .c-btn i{display:block;width:3px;height:13px;border-radius:2px;background:var(--accent)}
  .c-on{background:rgba(20,20,20,.86);color:#fff;border-color:var(--accent)}
  .c-off{background:rgba(0,0,0,.6);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.45)}
  .c-off i{opacity:.35}
  /* 案D: 普段は小さく */
  .d-on{background:rgba(20,20,20,.86);color:var(--accent);border-color:var(--accent)}
  .d-off{background:rgba(0,0,0,.6);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.45)}
  .note{font-size:11px;color:var(--text3);margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--border)}
</style>
</head>
<body class="dark">

<h1>字幕ボタンの見せ方 — 比較モック</h1>
<p class="lead">
  YouTube純正のCCと見分けがつくこと、こちらが<b>生成した字幕</b>だと文字で分かることが目的。
  上の並び（🔊 <span style="border:1px solid currentColor;border-radius:3px;padding:0 3px">cc</span> ⚙ ⛶）はYouTube自身のボタン（比較用）。
  その下がこちらのボタン。<b>ボタンを押すと 日本語 → 原語 → オフ と切り替わります。</b>
</p>

<div class="ctrls">
  <button class="ctrl on" id="t-yt">純正字幕も同時に出す</button>
  <button class="ctrl" id="t-theme">ライトモードで見る</button>
</div>
<p class="lead" style="margin-top:-6px">
  ※ 実際には純正字幕の位置はユーザー設定で動くので、重なることもあります。ここでは見比べやすいように離して置いています。
</p>

<div class="grid" id="grid"></div>

<p class="note">
  字幕本体の印は、案Cに「左の縦バー」、案Dに「出し始めだけラベル」、案Bに「文字色」を割り当てて比較できるようにしてあります。
  組み合わせは自由に変えられます。
</p>

<script>
const SUB = ['ですから、蹴るときは、かかとを私の', '股関節屈筋に置くようにしてください。'];
const YTSUB = ['So when you kick, put your heel', 'on my hip flexor.'];
const LANGS = ['日本語', '原語', 'オフ'];

const CARDS = [
  { id:'now', title:'いまの姿（v52.737）', desc:'「CC」と名乗っているので、YouTubeのCCと同じものに見える。字幕本体にも印が無い。',
    mark:'', btn:(st)=>`<button class="btn ${st<2?'now-on':'now-off'}">CC${st<2?' '+LANGS[st]:''}</button>` },

  { id:'a', title:'案A — 文字だけ変える', desc:'位置も大きさも今のまま、名前だけ「AI訳」に。最小の変更。オフの時も状態が出る。',
    mark:'', btn:(st)=>`<button class="btn ${st<2?'a-on':'a-off'}">AI訳 ${LANGS[st]}</button>` },

  { id:'b', title:'案B — 2段バッジ（出所＋言語）', desc:'出所を常に文字で表示。混同はまず起きないが、縦に場所を取る。字幕は「文字色を変える」印。',
    mark:'mark-color', btn:(st)=>`<button class="btn b-btn ${st<2?'b-on':'b-off'}"><em>AI訳</em>${LANGS[st]}</button>` },

  { id:'c', title:'案C — 色の縦線つき（推し）', desc:'アクセント色の縦線でアプリのUIだと分かる。字幕の左にも同じ色の縦バーが付くので、並んでもどちらか一目で分かる。',
    mark:'mark-bar', btn:(st)=>`<button class="btn c-btn ${st<2?'c-on':'c-off'}"><i></i>AI訳 ${LANGS[st]}</button>` },

  { id:'d', title:'案D — 普段は小さく、切替時に知らせる', desc:'普段は「AI訳」だけ。切り替えた瞬間に字幕の上へ3秒だけラベルが出る（押して確認）。映像への主張が一番少ない。',
    mark:'flash', btn:(st)=>`<button class="btn ${st<2?'d-on':'d-off'}">AI訳</button>` },
];

const state = {};
let showYt = true;

function card(c) {
  const st = state[c.id] ?? 0;
  const my = st < 2
    ? `<div class="my-cc ${c.mark==='mark-bar'?'mark-bar':''} ${c.mark==='mark-color'?'mark-color':''}">
         ${SUB.map(l=>`<b>${st===1?'When you kick, put your heel here.':l}</b>`).join('')}
       </div>` : '';
  const flash = c.mark==='flash' ? `<div class="flash" id="flash-${c.id}">AI訳 — ${LANGS[st]}</div>` : '';
  return `
  <div class="card">
    <div class="player">
      <div class="yt-title">Unstoppable Scissor Sweep – Andre Galvao<span>Atos Jiu-Jitsu HQ</span></div>
      <div class="yt-btns">
        <div class="yt-ic">🔊</div><div class="yt-ic box">cc</div><div class="yt-ic">⚙</div><div class="yt-ic">⛶</div>
      </div>
      ${my}${flash}
      <div class="yt-cc ${showYt?'on':''}">${YTSUB.map(l=>`<span>${l}</span>`).join('')}</div>
      <div class="ui" data-id="${c.id}">${c.btn(st)}<button class="btn gear">⚙</button></div>
      <div class="yt-bar"><i></i></div>
    </div>
    <div class="cap"><h2>${c.title}</h2><p>${c.desc}</p></div>
  </div>`;
}

function render() {
  document.getElementById('grid').innerHTML = CARDS.map(card).join('');
  document.querySelectorAll('.ui').forEach(ui => {
    ui.querySelector('.btn').addEventListener('click', () => {
      const id = ui.dataset.id;
      state[id] = ((state[id] ?? 0) + 1) % 3;
      render();
      const f = document.getElementById('flash-' + id);
      if (f && state[id] < 2) { f.classList.add('show'); setTimeout(()=>f.classList.remove('show'), 3000); }
    });
  });
}
document.getElementById('t-yt').addEventListener('click', (e) => {
  showYt = !showYt; e.target.classList.toggle('on', showYt);
  e.target.textContent = showYt ? '純正字幕も同時に出す' : '純正字幕は出さない';
  render();
});
document.getElementById('t-theme').addEventListener('click', (e) => {
  const light = document.body.classList.toggle('light');
  e.target.classList.toggle('on', light);
  e.target.textContent = light ? 'ダークモードで見る' : 'ライトモードで見る';
});
render();
</script>
</body>
</html>
