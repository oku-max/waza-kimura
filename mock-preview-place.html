<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOCK — プレビューのボタンの置き場所（5案）</title>
<!--
  見本の画面。本物のデータには一切書き込まない（localStorage も Firestore も触らない）。
  中身は固定の見本データ。触った結果はこのページの中だけで、閉じれば消える。
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1c1c1e;--surface:#2c2c2e;--surface2:#38383a;--surface3:#48484a;--accent:#e5c47a;--on-accent:#1c1c1e;--text:#e5e5e7;--text2:#ababab;--text3:#9a9aa0;--border:#48484a}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'DM Sans','Hiragino Sans','Noto Sans JP',-apple-system,sans-serif;max-width:1100px;margin:0 auto;padding-bottom:60px}
button{font-family:inherit;cursor:pointer;color:inherit}
.banner{background:#3a2f12;color:#f3dc9f;font-size:12px;line-height:1.7;padding:10px 16px}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1 1 118px;min-width:0;padding:8px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--text2);white-space:nowrap}
.tab.on{border-color:var(--accent);color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.row2{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--text3);flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;font-size:12px;color:var(--text2)}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.desc{margin:10px 12px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:12.5px;line-height:1.75;color:var(--text2)}
.desc b{color:var(--text)}
.desc .pro{color:#8fd19e}.desc .con{color:#f0a0a0}

/* ── カード（本物の見た目に寄せた見本） ── */
.list{padding:4px 12px;display:grid;gap:10px}
.list.grid{grid-template-columns:repeat(3,1fr);align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative}
.main{display:flex;gap:12px;padding:12px}
.list.grid .main{flex-direction:column;gap:0;padding:0}
.thumb{width:150px;min-width:150px;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;position:relative;background:var(--surface3);cursor:pointer;flex-shrink:0}
.list.grid .thumb{width:100%;min-width:0;border-radius:0}
.card.pv-wide .main{flex-direction:column;gap:8px}
.card.pv-wide .thumb{width:100%;min-width:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.pb{position:absolute;top:4px;right:4px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;color:#fff;background:rgba(192,57,43,.9)}
.dur{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.82);color:#fff;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px}
.open-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:opacity .15s}
.thumb:hover .open-ov{opacity:1}
.open-ov span{background:rgba(255,255,255,.92);color:#111;border-radius:16px;padding:4px 12px;font-size:12px;font-weight:700}
.x{position:absolute;top:4px;left:4px;z-index:3;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.8);color:#fff;border:1px solid rgba(255,255,255,.4);font-size:12px}
.body{flex:1;min-width:0}
.list.grid .body{padding:8px 10px 4px}
.title{font-size:14px;font-weight:700;line-height:1.45;margin-bottom:4px}
.ch{font-size:12px;color:var(--accent);font-weight:600}
.tags{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--border);font-size:12px;flex-wrap:wrap}
.tags span{padding:3px 10px;border-radius:12px;background:rgba(140,80,255,.16)}
.acts{display:flex;border-top:1px solid var(--border)}
.acts button{flex:1;background:none;border:0;padding:10px 4px;font-size:13px;color:var(--text2)}
.acts button+button{border-left:1px solid var(--border)}
.acts button.pv{color:var(--accent);font-weight:700}
.acts button.pv.on{background:rgba(229,196,122,.14)}

/* 案B: タイトル行の右端のピル */
.titlerow{display:flex;gap:8px;align-items:flex-start}
.titlerow .title{flex:1;min-width:0}
.pill{flex-shrink:0;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:14px;padding:3px 10px;font-size:12px;font-weight:700;margin-top:1px}
.pill.on{background:var(--accent);color:var(--on-accent)}

/* 案C: サムネの直下の帯 */
.strip{display:flex;border-top:1px solid var(--border)}
.list:not(.grid) .strip{border-top:0;margin:-4px 12px 10px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.strip button{flex:1;background:var(--surface2);border:0;padding:7px 4px;font-size:12px;font-weight:700;color:var(--text)}
.strip button+button{border-left:1px solid var(--border)}
.strip button.on{background:var(--accent);color:var(--on-accent)}

/* 案D: 開くボタンを別に（サムネ＝プレビュー） */
.openbtn{border:0;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;margin-top:6px}
.thumb.pvthumb .open-ov span{background:var(--accent);color:var(--on-accent)}

/* 案F・G: サムネの真下のボタン（サムネと同じ幅） */
.tcol{display:flex;flex-direction:column;gap:6px;flex-shrink:0;width:150px;max-width:100%}
.tcol .thumb{width:100%;min-width:0}
.list.grid .tcol{width:100%;gap:0}
.card.pv-wide .tcol{width:100%}
.under{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 4px;font-size:12.5px;font-weight:700;width:100%}
.list.grid .under{border-radius:0;border-width:1px 0}
.under.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lblrow{display:none;gap:6px;align-items:center;flex-wrap:wrap}
.lblrow.show{display:flex}
@media(max-width:700px){.tcol{width:120px}}

/* 案E: 長押し・ホバー */
.hold-ring{position:absolute;inset:0;border:3px solid var(--accent);border-radius:inherit;opacity:0;pointer-events:none}
.thumb.holding .hold-ring{opacity:1;animation:ring .5s linear forwards}
@keyframes ring{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.hint{font-size:11px;color:var(--text3);margin-top:4px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:50}
.toast.on{opacity:1}
@media(max-width:700px){.list.grid{grid-template-columns:1fr 1fr}.thumb{width:120px;min-width:120px}.title{font-size:13px}}
</style>
</head>
<body>
<div class="banner">
  見本の画面です（本物のデータには触りません）。上の A〜G を切り替えて、押し比べてください。<br>
  どの案も <b>サムネを押す＝動画パネルを開く</b>（D・F だけ逆）。プレビューは音なしでその場で再生します。
</div>
<div class="bar">
  <div class="tabs" id="tabs"></div>
  <div class="row2">
    <span>並び</span>
    <div class="seg" id="lay"><button data-v="list" class="on">スマホ（1列）</button><button data-v="grid">タブレット・PC（列）</button></div>
  </div>
  <div class="row2 lblrow" id="lblrow">
    <span>F の開くボタンの文言</span>
    <div class="seg" id="lbl"></div>
  </div>
</div>
<div class="desc" id="desc"></div>
<div class="list" id="list"></div>
<div class="toast" id="toast"></div>

<script>
const VIDEOS = [
  { id:'taiqQJGJXCY', title:'DEEP HALF CLUBがオススメする様々なディープハーフスイープを紹介した', ch:'『ブラジリアン柔術』DEEP HALF CLUB', tags:['ボトム'], dur:'13:15' },
  { id:'o_DG3s1_ztY', title:'歴代最強のハーフガーダーから学ぶ王者達のDEEP HALFについて解説した', ch:'『ブラジリアン柔術』DEEP HALF CLUB', tags:['ボトム','#ディープハーフ'], dur:'17:21' },
  { id:'XtBGHmC5t8s', title:'【岩崎正寛/DEEP HALF CLUB】アマゾン返し伝授！！', ch:'『ブラジリアン柔術』DEEP HALF CLUB', tags:['トップ'], dur:'9:02' },
];
const PLANS = {
  A: { name:'A 下のボタン列', desc:`カードの一番下（メモ・アーカイブの列）に <b>プレビュー</b> を足す。サムネは「開く」だけ。<br><span class="pro">○ 役割が場所で分かれる（上＝開く／下＝操作）。今あるボタンと同じ見た目なので迷わない。</span><br><span class="con">× サムネから指を遠くへ動かす。列が3つになり1つずつ少し狭くなる。</span>` },
  B: { name:'B タイトルの右', desc:`タイトルの右端に小さな <b>プレビュー</b> のボタン。サムネは「開く」だけ。<br><span class="pro">○ 目に入りやすい。サムネとははっきり別の場所。</span><br><span class="con">× タイトルが少し狭くなる。タイトルを押しても何も起きないのと並ぶので、押せる場所がまた1つ増える。</span>` },
  C: { name:'C サムネの真下の帯', desc:`サムネのすぐ下に <b>▶ 開く ｜ プレビュー</b> の2つを並べた帯。サムネの中には何も置かない。<br><span class="pro">○ 2つの違いが文字で並んで見える。一番迷わない。</span><br><span class="con">× カードが1段高くなる。サムネを押しても開くので「開く」は2か所になる。</span>` },
  D: { name:'D サムネ＝プレビュー', desc:`役割を入れ替える: <b>サムネを押すとプレビュー</b>、動画パネルは <b>開く</b> ボタンで。<br><span class="pro">○ 「押したら動く」がいちばん自然。ボタンは1つだけ。</span><br><span class="con">× 今までの「サムネ＝動画パネル」が変わる（慣れの問題）。表の画面やノートは今までどおりなので、画面によって違う。</span>` },
  F: { name:'F 押す＝プレビュー', desc:`<b>サムネを押すとプレビュー</b>。サムネの <b>真下</b> に動画パネルを開くボタン（文言は上で切り替え）。<br><span class="pro">○ 押したらその場で動く。開くボタンがサムネのすぐ下なので、どの動画のボタンか迷わない。</span><br><span class="con">× 今までの「サムネ＝動画パネル」が変わる（表の画面・ノートは今までどおり）。</span>` },
  G: { name:'G 真下にプレビュー', desc:`サムネを押すと <b>今までどおり動画パネル</b>。サムネの <b>真下</b> に <b>プレビュー</b> のボタン。<br><span class="pro">○ 今の操作は何も変わらない。ボタンがサムネのすぐ下なので、サムネの中の ▶ と混ざらない。</span><br><span class="con">× カードの左側が1段高くなる（スマホの1列ではタイトルの横の空きに収まる）。</span>` },
  E: { name:'E 長押し／マウスを乗せる', desc:`ボタンを置かない。<b>スマホはサムネを長押し</b>、<b>PC はマウスを1秒乗せる</b>とプレビュー。普通に押せば今までどおり開く。<br><span class="pro">○ 画面が今と全く同じ。YouTube と同じ操作。</span><br><span class="con">× 知らないと気づかない（ボタンが無い）。長押しは端末のメニューとぶつかることがある。</span>` },
};
let plan = 'A', layout = 'list', playing = null;
const LABELS = ['開く', '詳細', '再生', '動画を開く', 'くわしく'];
let fLabel = '開く';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function thumbHTML(v, i) {
  if (playing === i) {
    return `<iframe src="https://www.youtube.com/embed/${v.id}?autoplay=1&mute=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
      <button class="x" onclick="event.stopPropagation();stop()" aria-label="閉じる">✕</button>`;
  }
  const ovLabel = (plan === 'D' || plan === 'F') ? 'プレビュー' : '開く';
  return `<img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt=""><div class="pb">YT</div><div class="dur">▶ ${v.dur}</div>
    <div class="open-ov"><span>${ovLabel}</span></div><div class="hold-ring"></div>`;
}
function card(v, i) {
  const on = playing === i;
  const thumbClick = playing === i ? '' : ((plan === 'D' || plan === 'F') ? `toggle(${i})` : `openPanel(${i})`);
  const thumbCls = 'thumb' + ((plan === 'D' || plan === 'F') ? ' pvthumb' : '');
  const tagHTML = `<div class="tags">${v.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>`;
  let titleBlock = `<div class="title">${esc(v.title)}</div><div class="ch">${esc(v.ch)}</div>`;
  if (plan === 'B') titleBlock = `<div class="titlerow"><div class="title">${esc(v.title)}</div><button class="pill ${on?'on':''}" onclick="toggle(${i})">${on?'停止':'プレビュー'}</button></div><div class="ch">${esc(v.ch)}</div>`;
  if (plan === 'D') titleBlock += `<button class="openbtn" onclick="openPanel(${i})">開く</button>`;
  if (plan === 'E') titleBlock += `<div class="hint">${matchMedia('(hover:hover)').matches ? 'サムネにマウスを1秒乗せるとプレビュー' : 'サムネを長押しでプレビュー'}</div>`;
  const strip = plan === 'C' ? `<div class="strip"><button onclick="openPanel(${i})">▶ 開く</button><button class="${on?'on':''}" onclick="toggle(${i})">${on?'停止':'プレビュー'}</button></div>` : '';
  const acts = `<div class="acts"><button>💬 メモ</button>${plan === 'A' ? `<button class="pv ${on?'on':''}" onclick="toggle(${i})">${on?'■ 停止':'プレビュー'}</button>` : ''}<button>📦 アーカイブ</button></div>`;
  const wide = on && layout === 'list';
  const stripInGrid = layout === 'grid' ? strip : '';
  const stripInList = layout === 'list' ? strip : '';
  return `<div class="card ${wide ? 'pv-wide' : ''}">
    <div class="main">${tcol(v, i, thumbCls, thumbClick, on)}${stripInGrid}<div class="body">${titleBlock}</div></div>
    ${stripInList}${tagHTML}${acts}</div>`;
}
function tcol(v, i, cls, click, on) {
  const th = `<div class="${cls}" id="th-${i}" onclick="${click}">${thumbHTML(v, i)}</div>`;
  if (plan === 'F') return `<div class="tcol">${th}<button class="under" onclick="openPanel(${i})">${esc(fLabel)}</button></div>`;
  if (plan === 'G') return `<div class="tcol">${th}<button class="under ${on?'on':''}" onclick="toggle(${i})">${on?'停止':'プレビュー'}</button></div>`;
  return th;
}
function render() {
  document.getElementById('lblrow').classList.toggle('show', plan === 'F');
  document.getElementById('lbl').innerHTML = LABELS.map(l => `<button class="${l===fLabel?'on':''}" onclick="fLabel='${l}';render()">${l}</button>`).join('');
  document.getElementById('tabs').innerHTML = Object.keys(PLANS).map(k => `<button class="tab ${k===plan?'on':''}" onclick="setPlan('${k}')">${PLANS[k].name}</button>`).join('');
  document.getElementById('desc').innerHTML = PLANS[plan].desc;
  const l = document.getElementById('list');
  l.className = 'list' + (layout === 'grid' ? ' grid' : '');
  l.innerHTML = VIDEOS.map(card).join('');
  if (plan === 'E') wireHold();
}
function setPlan(k) { plan = k; playing = null; render(); }
function toggle(i) { playing = playing === i ? null : i; render(); }
function stop() { playing = null; render(); }
function openPanel(i) { toast('本物ではここで動画パネルが開きます'); }
let tt; function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2000); }

// 案E: 長押し（指）・1秒乗せる（マウス）
function wireHold() {
  VIDEOS.forEach((_, i) => {
    const th = document.getElementById('th-' + i); if (!th || playing === i) return;
    let timer = null, fired = false;
    const start = () => { fired = false; th.classList.add('holding'); timer = setTimeout(() => { fired = true; playing = i; render(); }, 500); };
    const cancel = () => { clearTimeout(timer); th.classList.remove('holding'); };
    th.addEventListener('touchstart', start, { passive: true });
    th.addEventListener('touchend', e => { cancel(); if (fired) e.preventDefault(); });
    th.addEventListener('touchmove', cancel, { passive: true });
    th.addEventListener('contextmenu', e => e.preventDefault());
    if (matchMedia('(hover:hover)').matches) {
      th.addEventListener('mouseenter', () => { th.classList.add('holding'); timer = setTimeout(() => { playing = i; render(); }, 1000); });
      th.addEventListener('mouseleave', cancel);
    }
    th.onclick = () => { if (!fired) openPanel(i); };
  });
}
document.getElementById('lay').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  layout = b.dataset.v; playing = null;
  document.querySelectorAll('#lay button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
render();
</script>
</body>
</html>
