<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WAZA KIMURA">
  <!-- タブのアイコンは16pxで表示される。既存のPWAアイコン（WAZA / KIMURA のワードマーク）は
       その大きさでは文字が潰れて読めないため、1文字のマークにする。
       配色はそのまま: 地=#1a1a1a（テーマカラーと同じ）／文字=白／下線=金 #c9871a。
       16pxでは横線が増えるほど潰れるので、要素はWと下線の2つだけにする。
       明るいタブでも暗いタブでも沈まないよう、地は塗りつぶしのままにする。 -->
  <rect width="64" height="64" rx="14" fill="#1a1a1a"/>
  <path d="M8 15 L17.6 45 L24.2 45 L32 27.5 L39.8 45 L46.4 45 L56 15 L48.4 15 L42.8 34.2 L35.2 15 L28.8 15 L21.2 34.2 L15.6 15 Z" fill="#fff"/>
  <rect x="14" y="49" width="36" height="4" rx="2" fill="#c9871a"/>
</svg>
