<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOCK — ブックマークの星を1〜3に（2案）</title>
<!--
  見本の画面。本物のデータには一切書き込まない（localStorage も Firestore も触らない）。
  押した結果はこのページの中だけ。
  オーナー「星の数を1〜3に」（2026-11-11）。いまの星（star:true）は ★1 として残す想定
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f6f4;--surface:#fff;--surface2:#f1f1ef;--accent:#111;--text:#111;--text2:#555;--text3:#70706c;--border:#e0e0dc;--star:#d9a400}
body.dark{--bg:#1c1c1e;--surface:#2c2c2e;--surface2:#38383a;--accent:#e5c47a;--text:#e5e5e7;--text2:#ababab;--text3:#9a9aa0;--border:#48484a;--star:#f2c94c}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'Hiragino Sans','Noto Sans JP',-apple-system,sans-serif;max-width:620px;margin:0 auto;padding-bottom:60px}
button{font-family:inherit;cursor:pointer;color:inherit}
.banner{background:#3a2f12;color:#f3dc9f;font-size:12px;line-height:1.7;padding:10px 16px}
.tabs{display:flex;gap:5px;padding:10px 12px 4px;flex-wrap:wrap}
.tab{flex:1;min-width:140px;padding:7px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--text2);text-align:left;line-height:1.4}
.tab b{display:block;font-size:12px;color:var(--text)}
.tab.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opts{display:flex;gap:12px;align-items:center;padding:8px 14px;font-size:11px;color:var(--text3)}
.opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
.desc{margin:6px 12px 10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:12px;line-height:1.75;color:var(--text2)}
.desc b{color:var(--text)}
.panel{margin:0 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.lbl{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.04em}
.hsp{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);white-space:nowrap}
.flt{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 6px}
.flt button{font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2)}
.flt button.on{background:var(--star);border-color:var(--star);color:#1c1c1e;font-weight:700}
.flt button:disabled{opacity:.4;cursor:default}
.row{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);padding:6px 4px}
.row.lv1{background:rgba(217,164,0,.07)} .row.lv2{background:rgba(217,164,0,.13)} .row.lv3{background:rgba(217,164,0,.20)}
.t{flex-shrink:0;padding:2px 8px;border-radius:5px;border:1.5px solid var(--accent);color:var(--accent);font-size:12px;min-width:58px;text-align:center;background:transparent}
.name{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed{padding:2px 7px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:9.5px;flex-shrink:0}
.star{flex-shrink:0;min-width:32px;height:30px;margin:-4px -2px;border:none;background:transparent;font-size:16px;line-height:1;color:var(--text3);border-radius:8px;padding:0 3px;letter-spacing:-2px}
.star.on{color:var(--star)}
.star3{display:inline-flex;flex-shrink:0;margin:-4px 0}
.star3 button{width:24px;height:30px;border:none;background:none;font-size:17px;line-height:1;color:var(--text3);border-radius:6px;padding:0}
.star3 button.on{color:var(--star)}
.dv{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;padding:12px 4px 6px;border-bottom:2px solid var(--text3)}
.dv .car{width:14px;font-size:10px;color:var(--text3);flex-shrink:0;transition:transform .15s}
.dv.open .car{transform:rotate(90deg)}
.dv .dt{flex:1;min-width:0;font-size:12.5px;font-weight:700}
.dv .meta{flex-shrink:0;color:var(--text3);font-size:10.5px;white-space:nowrap}
.dv .sc{color:var(--star);font-weight:700;margin-left:6px}
.empty{padding:16px 4px;font-size:11.5px;color:var(--text3);text-align:center}
.note{font-size:10.5px;color:var(--text3);padding:8px 2px 0;line-height:1.6}
@media (prefers-reduced-motion: reduce){.dv .car{transition:none}}
</style>
</head>
<body>
<div class="banner">見本です。本物のデータには何も書きません。星を1〜3で付けられます。上の「すべて／★1以上／★2以上／★3」で絞れます。押した結果はこのページの中だけです。</div>
<div class="tabs" id="tabs"></div>
<div class="opts"><label><input type="checkbox" id="dark"> 暗い画面</label></div>
<div class="desc" id="desc"></div>
<div class="panel">
  <div class="hd"><span class="lbl">🔖 ブックマーク</span>
    <span class="hsp"><button class="hbtn">説明を全部表示</button><button class="hbtn" id="allopen">仕切りを全部開く</button><button class="hbtn">✎ 仕切り</button></span></div>
  <div class="flt" id="flt"></div>
  <div id="list"></div>
  <div class="note" id="note"></div>
</div>
<script>
const DATA = [
  { div: 'ダックアンダーからのアームロック概要' },
  { t: '0:00', name: 'イントロ' },
  { t: '0:42', name: 'ダックアンダーの入り方', star: 1 },
  { div: '脚を掴まれた状況でのアームバー' },
  { t: '1:00', name: '脚を掴まれたときの姿勢', star: 3 },
  { t: '3:15', name: '腕を抜く角度' },
  { t: '6:40', name: 'アームバーへの移行', star: 2 },
  { t: '9:05', name: 'よくある失敗：肘が浮く', star: 1 },
  { div: 'ハーフベリンボロからのアームバー' },
  { t: '13:46', name: 'ハーフベリンボロの形' },
  { t: '15:10', name: '腰を回す方向' },
  { t: '17:02', name: '仕上げのグリップ' },
];
const PLANS = {
  A: { name: 'A 押すたびに増える', sub: 'ボタンは1つ・☆→★→★★→★★★→☆',
       desc: '<b>星のボタンは1つ</b>（今と同じ場所）。押すたびに ☆ → ★ → ★★ → ★★★ → ☆ と回り、付いている数だけ ★ が並ぶ。<br>★3 にしたいときは3回押す。行の色は星が多いほど少し濃くなる。' },
  B: { name: 'B 3つ並べて押す', sub: '☆☆☆ の何番目かを押す',
       desc: '<b>☆☆☆ をいつも3つ並べ</b>、押した位置までが ★ になる（2つ目を押すと ★★☆）。今と同じ数の所を押すと外れる。<br>1回で好きな数にできるが、行の右側の幅を少し多く使う。' },
};
let plan = 'A', min = 0;
const open = new Set([1]);
const stars = n => n ? '★'.repeat(n) : '☆';
function render() {
  document.getElementById('tabs').innerHTML = Object.entries(PLANS).map(([k, p]) => `<button class="tab ${k === plan ? 'on' : ''}" data-k="${k}"><b>${p.name}</b>${p.sub}</button>`).join('');
  document.getElementById('desc').innerHTML = PLANS[plan].desc +
    '<br>上の「<b>すべて／★1以上／★2以上／★3</b>」で絞れる（今の「★だけ表示」は「★1以上」と同じ）。絞っている間は、星のある区切りは開いて出す。仕切りの右には、その中で星の付いた件数（★3 など）が出る。';
  const total = DATA.filter(r => r.star).length;
  document.getElementById('flt').innerHTML = [[0, 'すべて'], [1, '★1以上'], [2, '★2以上'], [3, '★3']].map(([m, l]) =>
    `<button class="${m === min ? 'on' : ''}" data-m="${m}" ${m && !total ? 'disabled' : ''}>${l}</button>`).join('');
  const secs = []; let cur = null;
  for (const it of DATA) { if (it.div) { cur = { div: it.div, rows: [] }; secs.push(cur); } else cur.rows.push(it); }
  let html = '', shown = 0;
  secs.forEach((s, si) => {
    const sc = s.rows.filter(r => r.star).length;
    const rows = min ? s.rows.filter(r => (r.star || 0) >= min) : s.rows;
    if (min && !rows.length) return;
    const isOpen = !!min || open.has(si);
    html += `<button class="dv ${isOpen ? 'open' : ''}" data-s="${si}"><span class="car">▶</span><span class="dt">${s.div}</span><span class="meta">${s.rows.length}件${sc ? `<span class="sc">★${sc}</span>` : ''}</span></button>`;
    if (isOpen) rows.forEach(r => {
      shown++;
      const i = DATA.indexOf(r), n = r.star || 0;
      const st = plan === 'A'
        ? `<button class="star ${n ? 'on' : ''}" data-i="${i}" title="押すたびに星が増える（★★★の次は外れる）">${stars(n)}</button>`
        : `<span class="star3">${[1, 2, 3].map(k => `<button class="${k <= n ? 'on' : ''}" data-i="${i}" data-k="${k}" title="★${k}にする（同じ数なら外す）">${k <= n ? '★' : '☆'}</button>`).join('')}</span>`;
      html += `<div class="row ${n ? 'lv' + n : ''}"><button class="t">${r.t}</button><span class="name">${r.name}</span>${st}<button class="ed">編集</button></div>`;
    });
  });
  if (min && !shown) html = '<div class="empty">この数の星が付いたブックマークはありません</div>';
  document.getElementById('list').innerHTML = html;
  const c = k => DATA.filter(r => r.star === k).length;
  document.getElementById('note').textContent = `いま星が付いているのは ${total}件（★3: ${c(3)}件・★2: ${c(2)}件・★1: ${c(1)}件）。本物では、いま付いている星は ★1 として残す。`;
  bind();
}
function bind() {
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { plan = b.dataset.k; render(); });
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { min = +b.dataset.m; render(); });
  document.querySelectorAll('.star[data-i]').forEach(b => b.onclick = e => { e.stopPropagation(); const r = DATA[+b.dataset.i]; r.star = ((r.star || 0) + 1) % 4; if (!r.star) delete r.star; render(); });
  document.querySelectorAll('.star3 button').forEach(b => b.onclick = e => { e.stopPropagation(); const r = DATA[+b.dataset.i], k = +b.dataset.k; if ((r.star || 0) === k) delete r.star; else r.star = k; render(); });
  document.querySelectorAll('.dv').forEach(b => b.onclick = () => { if (min) return; const i = +b.dataset.s; open.has(i) ? open.delete(i) : open.add(i); render(); });
}
document.getElementById('allopen').onclick = () => { [0, 1, 2].forEach(i => open.add(i)); render(); };
document.getElementById('dark').onchange = e => document.body.classList.toggle('dark', e.target.checked);
render();
</script>
</body>
</html>
