<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOCK — ブックマークに星印（2案）</title>
<!--
  見本の画面。本物のデータには一切書き込まない（localStorage も Firestore も触らない）。
  押した結果はこのページの中だけ。
  オーナー「ブックマークの右か左に星印を作りたい」（2026-11-10）
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f6f4;--surface:#fff;--surface2:#f1f1ef;--accent:#111;--text:#111;--text2:#555;--text3:#70706c;--border:#e0e0dc;--star:#d9a400;--star-soft:rgba(217,164,0,.10)}
body.dark{--bg:#1c1c1e;--surface:#2c2c2e;--surface2:#38383a;--accent:#e5c47a;--text:#e5e5e7;--text2:#ababab;--text3:#9a9aa0;--border:#48484a;--star:#f2c94c;--star-soft:rgba(242,201,76,.12)}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'Hiragino Sans','Noto Sans JP',-apple-system,sans-serif;max-width:620px;margin:0 auto;padding-bottom:60px}
button{font-family:inherit;cursor:pointer;color:inherit}
.banner{background:#3a2f12;color:#f3dc9f;font-size:12px;line-height:1.7;padding:10px 16px}
.tabs{display:flex;gap:5px;padding:10px 12px 4px;flex-wrap:wrap}
.tab{flex:1;min-width:140px;padding:7px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--text2);text-align:left;line-height:1.4}
.tab b{display:block;font-size:12px;color:var(--text)}
.tab.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opts{display:flex;gap:12px;align-items:center;padding:8px 14px;font-size:11px;color:var(--text3)}
.opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
.desc{margin:6px 12px 10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:12px;line-height:1.75;color:var(--text2)}
.desc b{color:var(--text)}
.panel{margin:0 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.lbl{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.04em}
.hsp{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);white-space:nowrap}
.hbtn.on{background:var(--star);border-color:var(--star);color:#1c1c1e;font-weight:700}
.row{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);padding:6px 4px;position:relative}
.row.starred{background:var(--star-soft)}
.t{flex-shrink:0;padding:2px 8px;border-radius:5px;border:1.5px solid var(--accent);color:var(--accent);font-size:12px;min-width:58px;text-align:center;background:transparent}
.name{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed{padding:2px 7px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:9.5px;flex-shrink:0}
.star{flex-shrink:0;width:32px;height:32px;margin:-4px -2px;border:none;background:transparent;font-size:19px;line-height:1;color:var(--text3);display:flex;align-items:center;justify-content:center;border-radius:8px}
.star.on{color:var(--star)}
.star:active{background:var(--surface2)}
.dv{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;padding:12px 4px 6px;border-bottom:2px solid var(--text3)}
.dv .car{width:14px;font-size:10px;color:var(--text3);flex-shrink:0;transition:transform .15s}
.dv.open .car{transform:rotate(90deg)}
.dv .dt{flex:1;min-width:0;font-size:12.5px;font-weight:700}
.dv .meta{flex-shrink:0;color:var(--text3);font-size:10.5px;white-space:nowrap}
.dv .sc{color:var(--star);font-weight:700;margin-left:6px}
.empty{padding:16px 4px;font-size:11.5px;color:var(--text3);text-align:center}
.note{font-size:10.5px;color:var(--text3);padding:8px 2px 0;line-height:1.6}
@media (prefers-reduced-motion: reduce){.dv .car{transition:none}}
</style>
</head>
<body>
<div class="banner">見本です。本物のデータには何も書きません。☆ を押すと ★ になり、もう一度押すと外れます。「★だけ表示」で、星を付けたブックマークだけに絞れます。押した結果はこのページの中だけです。</div>
<div class="tabs" id="tabs"></div>
<div class="opts"><label><input type="checkbox" id="dark"> 暗い画面</label></div>
<div class="desc" id="desc"></div>
<div class="panel">
  <div class="hd"><span class="lbl">🔖 ブックマーク</span>
    <span class="hsp"><button class="hbtn" id="only">★だけ表示</button><button class="hbtn">説明を全部表示</button><button class="hbtn" id="allopen">仕切りを全部開く</button><button class="hbtn">✎ 仕切り</button></span></div>
  <div id="list"></div>
  <div class="note" id="note"></div>
</div>
<script>
const DATA = [
  { div: 'ダックアンダーからのアームロック概要' },
  { t: '0:00', name: 'イントロ' },
  { t: '0:42', name: 'ダックアンダーの入り方' },
  { div: '脚を掴まれた状況でのアームバー' },
  { t: '1:00', name: '脚を掴まれたときの姿勢', star: true },
  { t: '3:15', name: '腕を抜く角度' },
  { t: '6:40', name: 'アームバーへの移行' },
  { t: '9:05', name: 'よくある失敗：肘が浮く', star: true },
  { div: 'ハーフベリンボロからのアームバー' },
  { t: '13:46', name: 'ハーフベリンボロの形' },
  { t: '15:10', name: '腰を回す方向' },
  { t: '17:02', name: '仕上げのグリップ' },
];
const PLANS = {
  A: { name: 'A 左（時刻の前）', sub: '行の頭で目に入る', desc: '<b>星は行のいちばん左</b>（時刻の前）。並んだ星が縦にそろうので、どれに付いているか一目で分かる。押すと ★ になり、行がうすく色づく。' },
  B: { name: 'B 右（編集の前）', sub: '題名が左にそろう', desc: '<b>星は行の右</b>（「編集」の前）。時刻と題名の並びは今のまま変わらない。押すと ★ になり、行がうすく色づく。' },
};
let plan = 'A', only = false;
const open = new Set();
function render() {
  document.getElementById('tabs').innerHTML = Object.entries(PLANS).map(([k, p]) => `<button class="tab ${k === plan ? 'on' : ''}" data-k="${k}"><b>${p.name}</b>${p.sub}</button>`).join('');
  document.getElementById('desc').innerHTML = PLANS[plan].desc +
    '<br>上の「<b>★だけ表示</b>」を押すと、星を付けたブックマークだけになる（仕切りの中も全部開いて出す）。もう一度押すと元に戻る。仕切りの右には、その中の星の数（★2）が出る。';
  document.getElementById('only').classList.toggle('on', only);
  // 区切りごとに分ける
  const secs = []; let cur = null;
  for (const it of DATA) { if (it.div) { cur = { div: it.div, rows: [] }; secs.push(cur); } else cur.rows.push(it); }
  let html = '', shown = 0;
  secs.forEach((s, si) => {
    const stars = s.rows.filter(r => r.star).length;
    const rows = only ? s.rows.filter(r => r.star) : s.rows;
    if (only && !rows.length) return;
    const isOpen = only || open.has(si);
    html += `<button class="dv ${isOpen ? 'open' : ''}" data-s="${si}"><span class="car">▶</span><span class="dt">${s.div}</span><span class="meta">${s.rows.length}件${stars ? `<span class="sc">★${stars}</span>` : ''}</span></button>`;
    if (isOpen) rows.forEach(r => {
      shown++;
      const i = DATA.indexOf(r);
      const st = `<button class="star ${r.star ? 'on' : ''}" data-i="${i}" title="${r.star ? '星を外す' : '星を付ける'}">${r.star ? '★' : '☆'}</button>`;
      html += `<div class="row ${r.star ? 'starred' : ''}">${plan === 'A' ? st : ''}<button class="t">${r.t}</button><span class="name">${r.name}</span>${plan === 'B' ? st : ''}<button class="ed">編集</button></div>`;
    });
  });
  if (only && !shown) html = '<div class="empty">星を付けたブックマークはありません</div>';
  document.getElementById('list').innerHTML = html;
  const total = DATA.filter(r => r.star).length;
  document.getElementById('note').textContent = `いま星が付いているのは ${total}件。（本物では、星は動画のデータに保存して、ほかの端末でも同じに出す予定）`;
  bind();
}
function bind() {
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { plan = b.dataset.k; render(); });
  document.querySelectorAll('.star').forEach(b => b.onclick = e => { e.stopPropagation(); const r = DATA[+b.dataset.i]; r.star = !r.star; render(); });
  document.querySelectorAll('.dv').forEach(b => b.onclick = () => { if (only) return; const i = +b.dataset.s; open.has(i) ? open.delete(i) : open.add(i); render(); });
}
document.getElementById('only').onclick = () => { only = !only; render(); };
document.getElementById('allopen').onclick = () => { DATA.forEach((_, i) => open.add(i)); [0,1,2].forEach(i => open.add(i)); render(); };
document.getElementById('dark').onchange = e => document.body.classList.toggle('dark', e.target.checked);
open.add(1);
render();
</script>
</body>
</html>
